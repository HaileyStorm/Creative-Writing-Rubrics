<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="title desc">
<title id="title">HBQ leaf repeatability</title><desc id="desc">Two bars compare exact all-five-run agreement and nominal Krippendorff alpha.</desc>
<style>text{font-family:system-ui,sans-serif;fill:#172033}.muted{fill:#58657a}.grid{stroke:#d8dee8;stroke-width:1}.a{fill:#536dfe;stroke:#3448c5}.b{fill:#e07a5f;stroke:#a84d37}.c{fill:#2a9d8f;stroke:#176e64}.d{fill:#8d5fd3;stroke:#6640a0}.line{fill:none;stroke-width:3}.dot{stroke:#fff;stroke-width:2}</style>
<rect width="960" height="510" fill="#fbfcff"/><text x="40" y="42" font-size="26" font-weight="700">Leaf-level repeatability</text><text x="40" y="68" class="muted" font-size="15">Exact means all five runs returned the same verdict for that leaf.</text><text x="135" y="110" font-size="18" font-weight="600">24 per batch</text><rect x="230" y="180.9" width="110" height="219.1" class="a"/><rect x="230" y="140" width="110" height="260" fill="none" class="grid"/><text x="285" y="425" text-anchor="middle" font-size="19" font-weight="700">150/178</text><text x="285" y="450" text-anchor="middle" class="muted" font-size="14">84.3% exact</text><text x="285" y="475" text-anchor="middle" class="muted" font-size="14">α 0.771</text><text x="475" y="110" font-size="18" font-weight="600">one 178-leaf batch</text><rect x="570" y="166.3" width="110" height="233.7" class="b"/><rect x="570" y="140" width="110" height="260" fill="none" class="grid"/><text x="625" y="425" text-anchor="middle" font-size="19" font-weight="700">160/178</text><text x="625" y="450" text-anchor="middle" class="muted" font-size="14">89.9% exact</text><text x="625" y="475" text-anchor="middle" class="muted" font-size="14">α 0.869</text></svg>