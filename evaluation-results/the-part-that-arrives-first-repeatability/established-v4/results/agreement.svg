<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="t d"><title id="t">Exact agreement by output unit</title><desc id="d">Bars show exact agreement for each method’s native output units.</desc><style>text{font-family:system-ui,sans-serif;fill:#172033}.muted{fill:#58657a}.grid{stroke:#d8dee8}.a{fill:#536dfe}.b{fill:#e07a5f}.c{fill:#2a9d8f}.d{fill:#8d5fd3}</style><rect width="960" height="410" fill="#fbfcff"/><text x="40" y="42" font-size="26" font-weight="700">Exact all-five-run agreement</text><text x="40" y="68" class="muted" font-size="15">Coarser output designs can agree more easily.</text><text x="40" y="120" font-size="16" font-weight="600">HBQ leaves</text><rect x="320" y="98" width="520" height="28" fill="#e8ecf3"/><rect x="320" y="98" width="473.3" height="28" class="a"/><text x="860" y="120" font-size="15">91.0%</text><text x="40" y="195" font-size="16" font-weight="600">NAPLAN criteria</text><rect x="320" y="173" width="520" height="28" fill="#e8ecf3"/><rect x="320" y="173" width="520.0" height="28" class="b"/><text x="860" y="195" font-size="15">100.0%</text><text x="40" y="270" font-size="16" font-weight="600">Cambridge components</text><rect x="320" y="248" width="520" height="28" fill="#e8ecf3"/><rect x="320" y="248" width="260.0" height="28" class="c"/><text x="860" y="270" font-size="15">50.0%</text><text x="40" y="345" font-size="16" font-weight="600">Oregon traits</text><rect x="320" y="323" width="520" height="28" fill="#e8ecf3"/><rect x="320" y="323" width="520.0" height="28" class="d"/><text x="860" y="345" font-size="15">100.0%</text></svg>
