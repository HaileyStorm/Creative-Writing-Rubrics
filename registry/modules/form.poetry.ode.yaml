$schema: ../schema/hbq_rubric.schema.json
standard:
  id: HBQ-RS
  version: 1.2.0
module_id: form.poetry.ode
version: 1
title: Ode
kind: artifact_form
description: Research-informed binary rubric for ode.
origin: research_expansion
owner_domains:
- form.poetry.ode
