    type: question
    criterion_key: form.poetry.ode.address
    text: Does the poem establish a meaningful object, person, place, idea, or phenomenon of address or contemplation?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: form.poetry.ode.attention
    type: question
    criterion_key: form.poetry.ode.attention
    text: Does sustained attention reveal dimensions beyond initial praise or description?
