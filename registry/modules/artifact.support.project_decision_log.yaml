$schema: ../schema/hbq_rubric.schema.json
standard:
  id: HBQ-RS
  version: 1.0.0
module_id: artifact.support.project_decision_log
version: 1
title: Project decision log
kind: support_artifact
description: Research-informed binary rubric for project decision log.
origin: research_expansion
owner_domains:
- support.project_decision_log
artifact_types:
- planning_artifact
- reference_artifact
valid_scopes:
- artifact
- project
activation: Attach when project decision log is the active form, asset, or evaluation concern.
requires: []
incompatible_with: []
default_evidence_scope:
  current_artifact: true
  neighboring_units: 0
  project_sources: when supplied
