    type: question
    criterion_key: artifact.support.project_decision_log.decision
    text: Is each decision stated unambiguously?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: artifact.support.project_decision_log.date
    type: question
    criterion_key: artifact.support.project_decision_log.date
    text: Are date, author, and project branch recorded?
    pass_answer: 'YES'
    weight: 1.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: artifact.support.project_decision_log.reason
    type: question
    criterion_key: artifact.support.project_decision_log.reason
    text: Is the reason and intended effect recorded?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
