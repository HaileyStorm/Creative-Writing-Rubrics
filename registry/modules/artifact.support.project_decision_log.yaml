    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: artifact.support.project_decision_log.machine
    type: question
    criterion_key: artifact.support.project_decision_log.machine
    text: Can the active decision set be retrieved reliably by software and models?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
