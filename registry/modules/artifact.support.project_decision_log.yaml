    tags: []
  - id: artifact.support.project_decision_log.alternatives
    type: question
    criterion_key: artifact.support.project_decision_log.alternatives
    text: Are rejected or deferred alternatives linked rather than erased?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
