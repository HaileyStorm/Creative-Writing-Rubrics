    tags: []
  - id: core.freshness_and_non_genericness.no_llm_phrasing
    type: question
    criterion_key: core.freshness_and_non_genericness.no_llm_phrasing
    text: Does it avoid generic LLM phrasing, rhetorical templates, and overfamiliar contrast constructions?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
