    type: question
    criterion_key: core.freshness_and_non_genericness.no_forced_novelty
    text: Does it avoid novelty-seeking that sacrifices clarity, plausibility, tone, or purpose?
    pass_answer: 'YES'
    weight: 1.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
