    type: question
    criterion_key: op.outline.medium_detail_outline.causal_links
    text: Are transitions among units causally and emotionally legible?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
