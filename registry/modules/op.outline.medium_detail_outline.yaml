    type: question
    criterion_key: op.outline.medium_detail_outline.unit_function
    text: Does each chapter, episode, or sequence have a distinct narrative function?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
