$schema: ../schema/hbq_rubric.schema.json
standard:
  id: HBQ-RS
  version: 1.2.1
module_id: op.outline.medium_detail_outline
version: 1
title: Medium-detail outline
kind: procedure
description: Evaluates chapter or sequence functions, subplot coordination, information flow, character movement,
  pacing distribution, and transitions between major turns.
origin: user_inventory_refined
owner_domains:
- procedure.medium_detail_outline
artifact_types:
- any
valid_scopes:
- operation
activation: Attach when medium-detail outline is relevant to the active artifact or operation.
requires: []
incompatible_with: []
default_evidence_scope:
  current_artifact: true
  neighboring_units: 0
  project_sources: when supplied
tree:
