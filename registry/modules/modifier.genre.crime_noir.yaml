$schema: ../schema/hbq_rubric.schema.json
standard:
  id: HBQ-RS
  version: 1.0.0
module_id: modifier.genre.crime_noir
version: 1
title: Crime / noir
kind: modifier
description: Moral pressure, causality, social texture, voice, consequence, atmosphere, and avoidance of imitation
