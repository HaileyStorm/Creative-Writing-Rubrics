$schema: ../schema/hbq_rubric.schema.json
standard:
  id: HBQ-RS
  version: 1.2.1
module_id: artifact.support.character_sheet
version: 1
title: Character sheet
kind: support_artifact
description: Evaluates usefulness, specificity, internal consistency, behavioral implications, arc potential, relationships,
  voice cues, and distinction between characters.
origin: user_inventory_refined
owner_domains:
- support.character_sheet
artifact_types:
- planning_artifact
- reference_artifact
valid_scopes:
- any
activation: Attach when character sheet is relevant to the active artifact or operation.
requires: []
incompatible_with: []
default_evidence_scope:
  current_artifact: true
  neighboring_units: 0
  project_sources: when supplied
tree:
- id: artifact.support.character_sheet.quality
  type: group
  title: Character sheet checks
  score_mode: weighted_mean
  weight: 1.0
  children:
  - id: artifact.support.character_sheet.specificity
    type: question
    criterion_key: artifact.support.character_sheet.specificity
    text: Does the sheet contain specific, distinguishing information rather than generic trait lists?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: artifact.support.character_sheet.consistency
    type: question
    criterion_key: artifact.support.character_sheet.consistency
    text: Are facts, ages, relationships, abilities, and history internally consistent?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: artifact.support.character_sheet.behavior
    type: question
    criterion_key: artifact.support.character_sheet.behavior
    text: Do traits and motives imply observable behavior, choices, language, and attention?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: artifact.support.character_sheet.agency
    type: question
    criterion_key: artifact.support.character_sheet.agency
    text: Does the character possess goals, strategies, and capacities for consequential choice?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: artifact.support.character_sheet.contradiction
    type: question
    criterion_key: artifact.support.character_sheet.contradiction
    text: Does the sheet include productive contradictions, pressures, blind spots, or competing loyalties?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: artifact.support.character_sheet.arc
    type: question
    criterion_key: artifact.support.character_sheet.arc
    text: Does it identify plausible change, resistance, and pressure points?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: artifact.support.character_sheet.relationships
    type: question
    criterion_key: artifact.support.character_sheet.relationships
    text: Are key relationships represented as dynamic states rather than labels?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: artifact.support.character_sheet.voice
    type: question
    criterion_key: artifact.support.character_sheet.voice
    text: Does it provide usable cues for voice without reducing the character to catchphrases?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: artifact.support.character_sheet.utility
    type: question
    criterion_key: artifact.support.character_sheet.utility
    text: Can a drafting model use the sheet to make scene-level decisions?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  tags: []
modifier_actions: []
research_basis:
- cho_et_al_2026_bineval
- zhang_et_al_2026_rubricbench
notes:
- Derived from the supplied application rubric inventory and refined into atomic positive binary questions.
- YES means the observable criterion is satisfied; NOT_APPLICABLE and CANNOT_ASSESS are control states, not quality
  labels.
source_description: Evaluates usefulness, specificity, internal consistency, behavioral implications, arc potential,
  relationships, voice cues, and distinction between characters.
