$schema: ../schema/hbq_rubric.schema.json
standard:
  id: HBQ-RS
  version: 1.0.0
module_id: op.ingest.sheet_extraction
version: 1
title: Sheet extraction
kind: procedure
description: Evaluates extraction of character, setting, relationship, item, faction, timeline, and canon information
  without inventing unsupported facts.
origin: user_inventory_refined
owner_domains:
- procedure.sheet_extraction
artifact_types:
- any
valid_scopes:
- operation
activation: Attach when sheet extraction is relevant to the active artifact or operation.
requires: []
incompatible_with: []
default_evidence_scope:
  current_artifact: true
  neighboring_units: 0
  project_sources: when supplied
tree:
- id: op.ingest.sheet_extraction.quality
  type: group
  title: Sheet extraction checks
  score_mode: weighted_mean
  weight: 1.0
  children:
  - id: op.ingest.sheet_extraction.grounded
    type: question
    criterion_key: op.ingest.sheet_extraction.grounded
    text: Is every extracted sheet fact supported by a source passage or explicit user decision?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.ingest.sheet_extraction.entity
    type: question
    criterion_key: op.ingest.sheet_extraction.entity
    text: Are facts attached to the correct character, place, item, faction, relationship, or timeline entity?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.ingest.sheet_extraction.state
    type: question
    criterion_key: op.ingest.sheet_extraction.state
    text: Are current state, historical state, plans, possibilities, and discarded ideas distinguished?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.ingest.sheet_extraction.behavior
    type: question
    criterion_key: op.ingest.sheet_extraction.behavior
    text: Do character sheets capture behavioral implications and voice cues rather than labels alone?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.ingest.sheet_extraction.provenance
    type: question
    criterion_key: op.ingest.sheet_extraction.provenance
    text: Does each extracted fact retain source provenance and version?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.ingest.sheet_extraction.conflicts
    type: question
    criterion_key: op.ingest.sheet_extraction.conflicts
    text: Are conflicting facts represented as conflicts instead of silently reconciled?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.ingest.sheet_extraction.no_invention
    type: question
    criterion_key: op.ingest.sheet_extraction.no_invention
    text: Is unsupported inference excluded from established sheet facts?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  tags: []
modifier_actions: []
research_basis:
- cho_et_al_2026_bineval
- zhang_et_al_2026_rubricbench
- wu_et_al_2025_writingbench
- fein_et_al_2026_litbench
notes:
- Derived from the supplied application rubric inventory and refined into atomic positive binary questions.
- YES means the observable criterion is satisfied; NOT_APPLICABLE and CANNOT_ASSESS are control states, not quality
  labels.
source_description: Evaluates extraction of character, setting, relationship, item, faction, timeline, and canon
  information without inventing unsupported facts.
