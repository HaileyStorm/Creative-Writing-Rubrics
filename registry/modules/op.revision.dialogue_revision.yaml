$schema: ../schema/hbq_rubric.schema.json
standard:
  id: HBQ-RS
  version: 1.2.0
module_id: op.revision.dialogue_revision
version: 1
title: Dialogue revision
kind: procedure
description: Evaluates subtext, differentiation, rhythm, compression, dramatic action, and preservation of the scene’s
  factual and emotional state.
origin: user_inventory_refined
owner_domains:
- procedure.dialogue_revision
artifact_types:
- any
valid_scopes:
- operation
activation: Attach when dialogue revision is relevant to the active artifact or operation.
requires: []
incompatible_with: []
default_evidence_scope:
  current_artifact: true
  neighboring_units: 0
  project_sources: when supplied
tree:
- id: op.revision.dialogue_revision.quality
  type: group
  title: Dialogue revision checks
  score_mode: weighted_mean
  weight: 1.0
  children:
  - id: op.revision.dialogue_revision.target
    type: question
    criterion_key: op.revision.dialogue_revision.target
    text: Does the revision correct the specified dialogue problem?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.revision.dialogue_revision.voices
    type: question
    criterion_key: op.revision.dialogue_revision.voices
    text: Are speakers more distinguishable through attention, syntax, rhythm, register, and strategy?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.revision.dialogue_revision.subtext
    type: question
    criterion_key: op.revision.dialogue_revision.subtext
    text: Does more of the dramatic action occur through implication, evasion, pressure, and response?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.revision.dialogue_revision.rhythm
    type: question
    criterion_key: op.revision.dialogue_revision.rhythm
    text: Do turn length, interruption, silence, overlap, and pacing suit the exchange?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.revision.dialogue_revision.compression
    type: question
    criterion_key: op.revision.dialogue_revision.compression
    text: Has redundant or purely explanatory speech been removed without making the exchange opaque?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.revision.dialogue_revision.action
    type: question
    criterion_key: op.revision.dialogue_revision.action
    text: Does the dialogue change knowledge, relationship, commitment, leverage, mood, or action?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.revision.dialogue_revision.state
    type: question
    criterion_key: op.revision.dialogue_revision.state
    text: Are factual, physical, and emotional states preserved?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.revision.dialogue_revision.surround
    type: question
    criterion_key: op.revision.dialogue_revision.surround
    text: Do beats, action, and interiority around the speech still support it?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.revision.dialogue_revision.no_polish_flatten
    type: question
    criterion_key: op.revision.dialogue_revision.no_polish_flatten
    text: Does the revision avoid making every speaker equally polished, concise, or witty?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  tags: []
modifier_actions: []
research_basis:
- cho_et_al_2026_bineval
- zhang_et_al_2026_rubricbench
- wu_et_al_2025_writingbench
- fein_et_al_2026_litbench
notes:
- Derived from the supplied application rubric inventory and refined into atomic positive binary questions.
- YES means the observable criterion is satisfied; NOT_APPLICABLE and CANNOT_ASSESS are control states, not quality
  labels.
source_description: Evaluates subtext, differentiation, rhythm, compression, dramatic action, and preservation of
  the scene’s factual and emotional state.
