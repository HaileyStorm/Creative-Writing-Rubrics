$schema: ../schema/hbq_rubric.schema.json
standard:
  id: HBQ-RS
  version: 1.2.1
module_id: artifact.support.research_brief_or_dossier
version: 1
title: Research brief or dossier
kind: support_artifact
description: Evaluates source quality, relevance, factual accuracy, uncertainty, synthesis, citations, and direct
  usefulness to the writing task.
origin: user_inventory_refined
owner_domains:
- support.research_brief_or_dossier
artifact_types:
- planning_artifact
- reference_artifact
valid_scopes:
- any
activation: Attach when research brief or dossier is relevant to the active artifact or operation.
requires: []
incompatible_with: []
default_evidence_scope:
  current_artifact: true
  neighboring_units: 0
  project_sources: when supplied
tree:
- id: artifact.support.research_brief_or_dossier.quality
  type: group
  title: Research brief or dossier checks
  score_mode: weighted_mean
  weight: 1.0
  children:
  - id: artifact.support.research_brief_or_dossier.sources
    type: question
    criterion_key: artifact.support.research_brief_or_dossier.sources
    text: Are sources sufficiently authoritative and appropriate for the question?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: artifact.support.research_brief_or_dossier.accuracy
    type: question
    criterion_key: artifact.support.research_brief_or_dossier.accuracy
    text: Are factual claims accurately represented?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: artifact.support.research_brief_or_dossier.relevance
    type: question
    criterion_key: artifact.support.research_brief_or_dossier.relevance
    text: Does the dossier prioritize information that changes writing decisions?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: artifact.support.research_brief_or_dossier.synthesis
    type: question
    criterion_key: artifact.support.research_brief_or_dossier.synthesis
    text: Does it synthesize sources rather than stack summaries?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: artifact.support.research_brief_or_dossier.uncertainty
    type: question
    criterion_key: artifact.support.research_brief_or_dossier.uncertainty
    text: Are uncertainty, dispute, scope limits, and inference clearly marked?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: artifact.support.research_brief_or_dossier.citations
    type: question
    criterion_key: artifact.support.research_brief_or_dossier.citations
    text: Can claims be traced to citations or source IDs?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: artifact.support.research_brief_or_dossier.application
    type: question
    criterion_key: artifact.support.research_brief_or_dossier.application
    text: Does it translate research into narrative constraints, opportunities, vocabulary, and likely failure risks?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: artifact.support.research_brief_or_dossier.organization
    type: question
    criterion_key: artifact.support.research_brief_or_dossier.organization
    text: Can a writer or model retrieve the needed fact efficiently?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  tags: []
modifier_actions: []
research_basis:
- cho_et_al_2026_bineval
- zhang_et_al_2026_rubricbench
notes:
- Derived from the supplied application rubric inventory and refined into atomic positive binary questions.
- YES means the observable criterion is satisfied; NOT_APPLICABLE and CANNOT_ASSESS are control states, not quality
  labels.
source_description: Evaluates source quality, relevance, factual accuracy, uncertainty, synthesis, citations, and
  direct usefulness to the writing task.
