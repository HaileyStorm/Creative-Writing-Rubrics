      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.draft.draft_from_coarse_or_medium_outline.voice
    type: question
    criterion_key: op.draft.draft_from_coarse_or_medium_outline.voice
    text: Does it maintain project and character voice?
    pass_answer: 'YES'
