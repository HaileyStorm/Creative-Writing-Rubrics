$schema: ../schema/hbq_rubric.schema.json
standard:
  id: HBQ-RS
  version: 1.0.0
module_id: op.ingest.context_provenance
version: 1
title: Context provenance
kind: procedure
description: Checks that every supplied fact or passage can be traced to its source version and that outdated or
  alternate-branch material is not silently mixed in.
origin: user_inventory_refined
owner_domains:
- procedure.context_provenance
artifact_types:
- any
valid_scopes:
- operation
activation: Attach when context provenance is relevant to the active artifact or operation.
requires: []
incompatible_with: []
default_evidence_scope:
  current_artifact: true
  neighboring_units: 0
  project_sources: when supplied
tree:
- id: op.ingest.context_provenance.quality
  type: group
  title: Context provenance checks
  score_mode: weighted_mean
  weight: 1.0
  children:
  - id: op.ingest.context_provenance.traceable
    type: question
    criterion_key: op.ingest.context_provenance.traceable
    text: Can every supplied fact, excerpt, and instruction be traced to a source and version?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.ingest.context_provenance.authority
    type: question
    criterion_key: op.ingest.context_provenance.authority
    text: Is each source's authority status explicit?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.ingest.context_provenance.branch
    type: question
    criterion_key: op.ingest.context_provenance.branch
    text: Are alternate branches prevented from silently contaminating the active branch?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.ingest.context_provenance.superseded
    type: question
    criterion_key: op.ingest.context_provenance.superseded
    text: Are superseded facts omitted or clearly labeled as historical?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.ingest.context_provenance.transform
    type: question
    criterion_key: op.ingest.context_provenance.transform
    text: Are summaries and transformations linked to their originals?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.ingest.context_provenance.conflict
    type: question
    criterion_key: op.ingest.context_provenance.conflict
    text: Are source conflicts preserved for adjudication?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  tags: []
modifier_actions: []
research_basis:
- cho_et_al_2026_bineval
- zhang_et_al_2026_rubricbench
- wu_et_al_2025_writingbench
- fein_et_al_2026_litbench
notes:
- Derived from the supplied application rubric inventory and refined into atomic positive binary questions.
- YES means the observable criterion is satisfied; NOT_APPLICABLE and CANNOT_ASSESS are control states, not quality
  labels.
source_description: Checks that every supplied fact or passage can be traced to its source version and that outdated
  or alternate-branch material is not silently mixed in.
