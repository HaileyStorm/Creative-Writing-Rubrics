    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: model.release.multimodal_retention.omit
    type: question
    criterion_key: model.release.multimodal_retention.omit
    text: Is this module omitted rather than failed for builds intentionally lacking vision capability?
    pass_answer: 'YES'
    weight: 1.0
    question_type: diagnostic
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  tags: []
