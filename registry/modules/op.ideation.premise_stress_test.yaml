    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.ideation.premise_stress_test.theme
    type: question
    criterion_key: op.ideation.premise_stress_test.theme
    text: Does the premise generate thematic or conceptual implications without requiring a thesis?
    pass_answer: 'YES'
    weight: 1.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.ideation.premise_stress_test.assumptions
    type: question
    criterion_key: op.ideation.premise_stress_test.assumptions
    text: Are hidden logistical, social, technical, or motivational assumptions exposed?
    pass_answer: 'YES'
