    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.ideation.premise_stress_test.risks
    type: question
    criterion_key: op.ideation.premise_stress_test.risks
    text: Are major cliché, repetition, escalation, plausibility, and audience risks identified?
    pass_answer: 'YES'
