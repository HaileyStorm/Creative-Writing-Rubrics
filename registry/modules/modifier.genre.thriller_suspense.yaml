    type: question
    criterion_key: modifier.genre.thriller_suspense.threat
    text: Is the threat or destabilizing force concrete enough to shape decisions?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
