  - id: modifier.genre.thriller_suspense.vulnerability
    type: question
    criterion_key: modifier.genre.thriller_suspense.vulnerability
    text: Are characters vulnerable in specific, credible ways?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
