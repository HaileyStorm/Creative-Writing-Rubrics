$schema: ../schema/hbq_rubric.schema.json
standard:
  id: HBQ-RS
  version: 1.2.1
module_id: modifier.genre.thriller_suspense
version: 1
title: Thriller / suspense
kind: modifier
description: Escalation, urgency, vulnerability, threat logic, reversals, pacing, cause-and-effect pressure, and
  avoidance of stakes inflation without consequence.
origin: user_inventory_refined
owner_domains:
- genre.thriller_suspense
artifact_types:
- creative_text
valid_scopes:
- any
activation: Attach when thriller / suspense is relevant to the active artifact or operation.
requires: []
incompatible_with: []
default_evidence_scope:
  current_artifact: true
  neighboring_units: 0
  project_sources: when supplied
tree:
