    type: question
    criterion_key: op.ideation.relationship_faction_conception.asymmetry
    text: Does it contain a meaningful asymmetry in power, knowledge, need, loyalty, status, or vulnerability?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.ideation.relationship_faction_conception.goals
    type: question
    criterion_key: op.ideation.relationship_faction_conception.goals
    text: Are convergent and conflicting goals both identifiable where the concept calls for them?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.ideation.relationship_faction_conception.pressure
    type: question
    criterion_key: op.ideation.relationship_faction_conception.pressure
    text: Are specific pressure points, dependencies, taboos, debts, or leverage available for scenes?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.ideation.relationship_faction_conception.change
    type: question
    criterion_key: op.ideation.relationship_faction_conception.change
    text: Can the relationship or faction plausibly change state through events and choices?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.ideation.relationship_faction_conception.central
    type: question
    criterion_key: op.ideation.relationship_faction_conception.central
    text: Does it connect to the work's central movement rather than exist as detached background?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.ideation.relationship_faction_conception.behavior
    type: question
    criterion_key: op.ideation.relationship_faction_conception.behavior
    text: Does the conception imply how members act differently in public, private, and under stress?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  tags: []
modifier_actions: []
