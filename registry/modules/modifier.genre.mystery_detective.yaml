    type: question
    criterion_key: modifier.genre.mystery_detective.central_question
    text: Is the central mystery or investigative question clear enough to organize reader attention?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
