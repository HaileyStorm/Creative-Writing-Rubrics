    type: question
    criterion_key: modifier.genre.mystery_detective.clue_fairness
    text: Are decisive clues available, interpretable, and not retroactively invented?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
