$schema: ../schema/hbq_rubric.schema.json
standard:
  id: HBQ-RS
  version: 1.0.0
module_id: modifier.genre.mystery_detective
version: 1
title: Mystery / detective
kind: modifier
description: Clue fairness, information control, investigation logic, suspect distinction, revelation timing, solution
  coherence, and reader solvability at the intended level.
origin: user_inventory_refined
owner_domains:
- genre.mystery_detective
artifact_types:
- creative_text
valid_scopes:
- any
activation: Attach when mystery / detective is relevant to the active artifact or operation.
requires: []
incompatible_with: []
default_evidence_scope:
  current_artifact: true
  neighboring_units: 0
  project_sources: when supplied
tree:
- id: modifier.genre.mystery_detective.quality
  type: group
  title: Mystery / detective contract
  score_mode: weighted_mean
  weight: 1.0
  children:
