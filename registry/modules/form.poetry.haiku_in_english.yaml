notes:
- Derived from the supplied application rubric inventory and refined into atomic positive binary questions.
- YES means the observable criterion is satisfied; NOT_APPLICABLE and CANNOT_ASSESS are control states, not quality
  labels.
source_description: Handles the intended syllabic pattern, seasonal reference or allusion, cut/caesura, juxtaposition,
  immediacy, compression, and the relation between literal observation and resonance. Multi-stanza variants must
  apply stanza-level form while allowing some required material to work across the whole.
profile_overrides:
  default_profile: contemporary_english_haiku
  profiles:
    strict_english_575:
      lines_per_stanza: 3
      syllables:
      - 5
      - 7
      - 5
      seasonal_reference_scope: whole_poem
      cut_scope: each_stanza
      multi_stanza_policy: each stanza follows 5-7-5; kigo may be whole-sequence only when explicitly enabled
    contemporary_english_haiku:
      lines_per_stanza: 3
      syllables: not fixed; generally shorter than seventeen English syllables
      seasonal_reference_scope: whole_poem
      cut_scope: each_stanza
      multi_stanza_policy: each stanza remains haiku-sized; shared seasonal field may span the sequence
  pronunciation_policy: Use supplied dialect/lexicon first; otherwise report ambiguous syllable counts rather than
    guessing silently.
