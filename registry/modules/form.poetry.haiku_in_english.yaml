  version: 1.2.0
module_id: form.poetry.haiku_in_english
version: 1
title: Haiku in English
kind: artifact_form
description: Handles the intended syllabic pattern, seasonal reference or allusion, cut/caesura, juxtaposition,
  immediacy, compression, and the relation between literal observation and resonance. Multi-stanza variants must
  apply stanza-level form while allowing some required material to work across the whole.
origin: user_inventory_refined
owner_domains:
- form.haiku_in_english
artifact_types:
- poetry
valid_scopes:
- line
- stanza
- poem
- collection
activation: Attach when haiku in english is relevant to the active artifact or operation.
requires: []
incompatible_with: []
default_evidence_scope:
