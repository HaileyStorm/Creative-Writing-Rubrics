    weight: 1.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: craft.narrative.transitions_and_connective_tissue.mode
    type: question
    criterion_key: craft.narrative.transitions_and_connective_tissue.mode
    text: Are shifts among scene, summary, exposition, reflection, document, and other modes controlled?
