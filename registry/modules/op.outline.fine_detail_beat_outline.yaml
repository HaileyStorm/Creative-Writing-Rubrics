$schema: ../schema/hbq_rubric.schema.json
standard:
  id: HBQ-RS
  version: 1.2.0
module_id: op.outline.fine_detail_beat_outline
version: 1
title: Fine-detail / beat outline
kind: procedure
description: Evaluates scene-level objectives, participants, setting, starting state, pressure, beats, turn, resulting
