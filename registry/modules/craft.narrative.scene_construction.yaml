$schema: ../schema/hbq_rubric.schema.json
standard:
  id: HBQ-RS
  version: 1.0.0
module_id: craft.narrative.scene_construction
version: 1
title: Scene construction
kind: craft
description: Evaluates scene purpose, entry point, local objective, conflict or pressure, progression, turn, changed
  state, exit, and connection to surrounding scenes. Not every quiet scene needs overt conflict, but it should create
  meaningful change or understanding.
origin: user_inventory_refined
owner_domains:
- narrative.scene_construction
artifact_types:
- prose_fiction
- creative_nonfiction
- dramatic_writing
- narrative_poetry
- interactive_fiction
valid_scopes:
- beat
- scene
- chapter
- sequence
- act
- manuscript
- series
activation: Attach when scene construction is relevant to the active artifact or operation.
requires: []
incompatible_with: []
default_evidence_scope:
  current_artifact: true
  neighboring_units: 0
  project_sources: when supplied
tree:
- id: craft.narrative.scene_construction.quality
  type: group
  title: Scene construction
  score_mode: weighted_mean
  weight: 1.0
  children:
  - id: craft.narrative.scene_construction.purpose
    type: question
    criterion_key: craft.narrative.scene_construction.purpose
    text: Does the scene perform a discernible narrative, character, relational, atmospheric, or thematic function?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: craft.narrative.scene_construction.entry
    type: question
    criterion_key: craft.narrative.scene_construction.entry
    text: Does the scene enter at a point that avoids unnecessary preamble while preserving needed orientation?
    pass_answer: 'YES'
    weight: 1.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: craft.narrative.scene_construction.objective
    type: question
    criterion_key: craft.narrative.scene_construction.objective
    text: Is there a local want, task, question, pressure, or focus that organizes the scene?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: craft.narrative.scene_construction.pressure
    type: question
    criterion_key: craft.narrative.scene_construction.pressure
    text: Does something complicate, resist, expose, or deepen the scene's local movement?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: craft.narrative.scene_construction.progression
    type: question
    criterion_key: craft.narrative.scene_construction.progression
    text: Do beats build on one another rather than circle or reset?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: craft.narrative.scene_construction.turn
    type: question
    criterion_key: craft.narrative.scene_construction.turn
    text: Does the scene contain a meaningful change of information, decision, relationship, condition, perception,
      or possibility?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: craft.narrative.scene_construction.changed_state
    type: question
    criterion_key: craft.narrative.scene_construction.changed_state
    text: Is the end state meaningfully different from the beginning state?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: craft.narrative.scene_construction.exit
    type: question
    criterion_key: craft.narrative.scene_construction.exit
    text: Does the exit place emphasis effectively and create an appropriate relation to what follows?
    pass_answer: 'YES'
    weight: 1.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: craft.narrative.scene_construction.context_fit
    type: question
    criterion_key: craft.narrative.scene_construction.context_fit
    text: Does the scene connect coherently to the preceding and following units when those are supplied?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  tags: []
modifier_actions: []
research_basis:
- cho_et_al_2026_bineval
- zhang_et_al_2026_rubricbench
- vaezi_rezaei_2018
- carey_davidow_williams_2022
- gomez_rodriguez_williams_2023
- fein_et_al_2026_litbench
notes:
- Derived from the supplied application rubric inventory and refined into atomic positive binary questions.
- YES means the observable criterion is satisfied; NOT_APPLICABLE and CANNOT_ASSESS are control states, not quality
  labels.
source_description: Evaluates scene purpose, entry point, local objective, conflict or pressure, progression, turn,
  changed state, exit, and connection to surrounding scenes. Not every quiet scene needs overt conflict, but it
  should create meaningful change or understanding.
