  type: group
  title: Foreshadowing, setup, and payoff
  score_mode: weighted_mean
  weight: 1.0
  children:
  - id: craft.narrative.foreshadowing_setup_and_payoff.preparation
    type: question
    criterion_key: craft.narrative.foreshadowing_setup_and_payoff.preparation
    text: Are major payoffs prepared through prior detail, pattern, motive, rule, or expectation?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: craft.narrative.foreshadowing_setup_and_payoff.subtlety
    type: question
    criterion_key: craft.narrative.foreshadowing_setup_and_payoff.subtlety
    text: Are setups noticeable enough to register without being so emphasized that they mechanically announce the
      payoff?
    pass_answer: 'YES'
    weight: 1.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: craft.narrative.foreshadowing_setup_and_payoff.expectation
    type: question
    criterion_key: craft.narrative.foreshadowing_setup_and_payoff.expectation
    text: Does the work create productive reader expectations that can be fulfilled, complicated, or deliberately
