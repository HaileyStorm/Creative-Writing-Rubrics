$schema: ../schema/hbq_rubric.schema.json
standard:
  id: HBQ-RS
  version: 1.2.0
module_id: craft.narrative.foreshadowing_setup_and_payoff
version: 1
title: Foreshadowing, setup, and payoff
kind: craft
description: Evaluates preparation, reader expectation, delayed consequences, thematic echoes, planted details,
  and whether payoffs are earned, forgotten, or over-signaled.
origin: user_inventory_refined
owner_domains:
- narrative.foreshadowing_setup_and_payoff
artifact_types:
- prose_fiction
- creative_nonfiction
- dramatic_writing
- narrative_poetry
- interactive_fiction
valid_scopes:
- beat
- scene
- chapter
- sequence
- act
- manuscript
- series
activation: Attach when foreshadowing, setup, and payoff is relevant to the active artifact or operation.
requires: []
incompatible_with: []
default_evidence_scope:
  current_artifact: true
  neighboring_units: 0
  project_sources: when supplied
tree:
