$schema: ../schema/hbq_rubric.schema.json
standard:
  id: HBQ-RS
  version: 1.0.0
module_id: op.ideation.idea_refinement
version: 1
title: Idea refinement
kind: procedure
description: Evaluates whether a vague or flawed idea becomes more specific, coherent, narratively fertile, and
  aligned with user intent without losing its distinctive core.
origin: user_inventory_refined
owner_domains:
- procedure.idea_refinement
artifact_types:
- any
valid_scopes:
- operation
activation: Attach when idea refinement is relevant to the active artifact or operation.
requires: []
incompatible_with: []
default_evidence_scope:
  current_artifact: true
  neighboring_units: 0
  project_sources: when supplied
tree:
- id: op.ideation.idea_refinement.quality
  type: group
  title: Idea refinement checks
  score_mode: weighted_mean
  weight: 1.0
  children:
  - id: op.ideation.idea_refinement.core
    type: question
    criterion_key: op.ideation.idea_refinement.core
    text: Does the refinement preserve the idea's distinctive core?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.ideation.idea_refinement.specificity
    type: question
    criterion_key: op.ideation.idea_refinement.specificity
    text: Does it replace vagueness with concrete characters, constraints, stakes, images, or mechanisms?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.ideation.idea_refinement.coherence
    type: question
    criterion_key: op.ideation.idea_refinement.coherence
    text: Does it resolve internal contradictions without flattening useful tension?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.ideation.idea_refinement.fertility
    type: question
    criterion_key: op.ideation.idea_refinement.fertility
    text: Does it increase the idea's capacity to generate scenes, decisions, and consequences?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.ideation.idea_refinement.fit
    type: question
    criterion_key: op.ideation.idea_refinement.fit
    text: Does it align with project intent, form, scale, genre, and audience?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.ideation.idea_refinement.risk
    type: question
    criterion_key: op.ideation.idea_refinement.risk
    text: Does it identify remaining assumptions or failure risks?
    pass_answer: 'YES'
    weight: 1.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.ideation.idea_refinement.no_generic
    type: question
    criterion_key: op.ideation.idea_refinement.no_generic
    text: Does it avoid refining the idea toward a safer but more generic version?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  tags: []
modifier_actions: []
research_basis:
- cho_et_al_2026_bineval
- zhang_et_al_2026_rubricbench
- wu_et_al_2025_writingbench
- fein_et_al_2026_litbench
notes:
- Derived from the supplied application rubric inventory and refined into atomic positive binary questions.
- YES means the observable criterion is satisfied; NOT_APPLICABLE and CANNOT_ASSESS are control states, not quality
  labels.
source_description: Evaluates whether a vague or flawed idea becomes more specific, coherent, narratively fertile,
  and aligned with user intent without losing its distinctive core.
