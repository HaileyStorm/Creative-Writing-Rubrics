    tags: []
  - id: form.audio.character_voice_performance.intention
    type: question
    criterion_key: form.audio.character_voice_performance.intention
    text: Does delivery communicate the character's immediate objective and subtext?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
