$schema: ../schema/hbq_rubric.schema.json
standard:
  id: HBQ-RS
  version: 1.2.0
module_id: form.audio.character_voice_performance
version: 1
title: Character voice performance
kind: audio_artifact
description: Research-informed binary rubric for character voice performance.
origin: research_expansion
owner_domains:
- audio.character_voice_performance
artifact_types:
