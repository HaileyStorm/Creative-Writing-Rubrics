    type: question
    criterion_key: form.audio.character_voice_performance.identity
    text: Does the voice fit the character's age, body, background, role, and project direction?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: form.audio.character_voice_performance.distinct
    type: question
    criterion_key: form.audio.character_voice_performance.distinct
    text: Is the character distinguishable from other voices without exaggerated gimmicks?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: form.audio.character_voice_performance.stable
    type: question
    criterion_key: form.audio.character_voice_performance.stable
    text: Does voice identity remain stable across emotion, volume, pace, and scene context?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
