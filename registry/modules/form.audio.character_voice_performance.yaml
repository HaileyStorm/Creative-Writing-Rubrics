      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: form.audio.character_voice_performance.emotion
    type: question
    criterion_key: form.audio.character_voice_performance.emotion
    text: Are emotional changes specific and earned rather than generic presets?
    pass_answer: 'YES'
