    type: question
    criterion_key: model.release.creative_writing_capability_retention.prose
    text: Is prose quality non-inferior across short and long forms?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
