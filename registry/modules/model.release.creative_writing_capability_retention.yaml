$schema: ../schema/hbq_rubric.schema.json
standard:
  id: HBQ-RS
  version: 1.2.0
module_id: model.release.creative_writing_capability_retention
version: 1
title: Creative-writing capability retention
kind: model_build
description: Compares the modified/pruned/quantized model with its source across prose, dialogue, revision, long-form
