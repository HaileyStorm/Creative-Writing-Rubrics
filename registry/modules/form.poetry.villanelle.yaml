  - id: form.poetry.villanelle.rhyme
    type: question
    criterion_key: form.poetry.villanelle.rhyme
    text: Does the poem maintain the two-rhyme architecture?
    pass_answer: 'YES'
    weight: 2.0
    question_type: hard_gate
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: form.poetry.villanelle.variation
    type: question
    criterion_key: form.poetry.villanelle.variation
    text: Do context, punctuation, syntax, or emphasis make each refrain recurrence change meaning?
    pass_answer: 'YES'
    weight: 2.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: form.poetry.villanelle.development
    type: question
    criterion_key: form.poetry.villanelle.development
    text: Does the poem develop despite its circular form?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: form.poetry.villanelle.no_filler
    type: question
    criterion_key: form.poetry.villanelle.no_filler
    text: Does it avoid filler inserted merely to reach refrain or rhyme positions?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: form.poetry.villanelle.closure
    type: question
    criterion_key: form.poetry.villanelle.closure
    text: Does the final joining of refrains create culmination rather than simple repetition?
    pass_answer: 'YES'
