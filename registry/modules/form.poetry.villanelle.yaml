    type: question
    criterion_key: form.poetry.villanelle.nineteen
    text: Does the poem contain nineteen lines organized as five tercets and a quatrain?
    pass_answer: 'YES'
    weight: 2.0
    question_type: hard_gate
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: form.poetry.villanelle.refrains
    type: question
    criterion_key: form.poetry.villanelle.refrains
    text: Are the two refrain lines repeated in the required alternating pattern and joined in the final quatrain?
    pass_answer: 'YES'
    weight: 2.5
    question_type: hard_gate
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
