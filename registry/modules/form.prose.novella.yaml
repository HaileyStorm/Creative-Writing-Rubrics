$schema: ../schema/hbq_rubric.schema.json
standard:
  id: HBQ-RS
  version: 1.0.0
module_id: form.prose.novella
version: 1
title: Novella
kind: artifact_form
description: Evaluates sustained but concentrated development, limited subplots, structural proportion, and whether
  the work justifies more space than a short story without diffusing like an underbuilt novel.
origin: user_inventory_refined
owner_domains:
- form.novella
artifact_types:
- prose_fiction
valid_scopes:
- complete_work
- manuscript
activation: Attach when novella is relevant to the active artifact or operation.
requires: []
incompatible_with: []
default_evidence_scope:
  current_artifact: true
  neighboring_units: 0
  project_sources: when supplied
tree:
- id: form.prose.novella.quality
  type: group
  title: Novella checks
  score_mode: weighted_mean
  weight: 1.0
  children:
  - id: form.prose.novella.concentration
    type: question
    criterion_key: form.prose.novella.concentration
    text: Does the work sustain development while retaining greater concentration than a typical novel?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: form.prose.novella.scope
    type: question
    criterion_key: form.prose.novella.scope
    text: Is the number of primary arcs and subplots proportionate to novella length?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: form.prose.novella.development
    type: question
    criterion_key: form.prose.novella.development
    text: Do the central character, relationship, conflict, or idea receive more development than a short story
      could comfortably hold?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: form.prose.novella.proportion
    type: question
    criterion_key: form.prose.novella.proportion
    text: Are sections and turns proportioned to avoid both rushed compression and novel-like diffusion?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: form.prose.novella.continuity
    type: question
    criterion_key: form.prose.novella.continuity
    text: Does the work sustain causal and thematic continuity across its full span?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: form.prose.novella.payoff
    type: question
    criterion_key: form.prose.novella.payoff
    text: Are the work's principal setups and arc movements paid off at novella scale?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: form.prose.novella.justifies_length
    type: question
    criterion_key: form.prose.novella.justifies_length
    text: Does the work justify its additional length through accumulation, complication, or depth rather than repetition?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  tags: []
modifier_actions: []
research_basis:
- cho_et_al_2026_bineval
- zhang_et_al_2026_rubricbench
- fein_et_al_2026_litbench
- wu_et_al_2025_writingbench
notes:
- Derived from the supplied application rubric inventory and refined into atomic positive binary questions.
- YES means the observable criterion is satisfied; NOT_APPLICABLE and CANNOT_ASSESS are control states, not quality
  labels.
source_description: Evaluates sustained but concentrated development, limited subplots, structural proportion, and
  whether the work justifies more space than a short story without diffusing like an underbuilt novel.
