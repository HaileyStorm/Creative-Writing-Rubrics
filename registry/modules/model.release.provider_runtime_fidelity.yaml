$schema: ../schema/hbq_rubric.schema.json
standard:
  id: HBQ-RS
  version: 1.0.0
module_id: model.release.provider_runtime_fidelity
version: 1
title: Provider/runtime fidelity
kind: model_build
description: Checks that the same model behaves equivalently across direct GGUF, managed local server, remote OpenAI-compatible
  server, MTP on/off, and supported context/cache settings.
origin: user_inventory_refined
owner_domains:
- model.provider_runtime_fidelity
artifact_types:
- model_build
valid_scopes:
- any
activation: Attach when provider/runtime fidelity is relevant to the active artifact or operation.
requires: []
incompatible_with: []
default_evidence_scope:
  current_artifact: true
  neighboring_units: 0
  project_sources: when supplied
tree:
- id: model.release.provider_runtime_fidelity.quality
  type: group
  title: Provider/runtime fidelity checks
  score_mode: weighted_mean
  weight: 1.0
  children:
