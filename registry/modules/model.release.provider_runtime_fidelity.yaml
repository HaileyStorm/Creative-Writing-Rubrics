    type: question
    criterion_key: model.release.provider_runtime_fidelity.identity
    text: Is the exact model, tokenizer, quantization, adapter, and sampler configuration identified across runtimes?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
