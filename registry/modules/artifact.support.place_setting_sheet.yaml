$schema: ../schema/hbq_rubric.schema.json
standard:
  id: HBQ-RS
  version: 1.0.0
module_id: artifact.support.place_setting_sheet
version: 1
title: Place / setting sheet
kind: support_artifact
description: Evaluates spatial usability, sensory identity, history, social function, constraints, narrative opportunities,
  and links to actual scenes.
origin: user_inventory_refined
owner_domains:
- support.place_setting_sheet
artifact_types:
- planning_artifact
- reference_artifact
valid_scopes:
- any
activation: Attach when place / setting sheet is relevant to the active artifact or operation.
requires: []
incompatible_with: []
default_evidence_scope:
  current_artifact: true
  neighboring_units: 0
  project_sources: when supplied
tree:
- id: artifact.support.place_setting_sheet.quality
  type: group
  title: Place / setting sheet checks
  score_mode: weighted_mean
  weight: 1.0
  children:
  - id: artifact.support.place_setting_sheet.spatial
    type: question
    criterion_key: artifact.support.place_setting_sheet.spatial
    text: Does the sheet make relevant spatial relationships usable for scene blocking and movement?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: artifact.support.place_setting_sheet.sensory
    type: question
    criterion_key: artifact.support.place_setting_sheet.sensory
    text: Does the place have a distinguishing sensory identity?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: artifact.support.place_setting_sheet.history
    type: question
    criterion_key: artifact.support.place_setting_sheet.history
    text: Does relevant history explain present conditions and tensions?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: artifact.support.place_setting_sheet.social
    type: question
    criterion_key: artifact.support.place_setting_sheet.social
    text: Does it identify the place's social, economic, institutional, or ritual functions?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: artifact.support.place_setting_sheet.constraints
    type: question
    criterion_key: artifact.support.place_setting_sheet.constraints
    text: Does it specify constraints, hazards, access, resources, and affordances?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: artifact.support.place_setting_sheet.opportunities
    type: question
    criterion_key: artifact.support.place_setting_sheet.opportunities
    text: Does it generate concrete scene, conflict, discovery, and image opportunities?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: artifact.support.place_setting_sheet.links
    type: question
    criterion_key: artifact.support.place_setting_sheet.links
    text: Is the place linked to actual characters, events, timelines, and manuscript units?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: artifact.support.place_setting_sheet.utility
    type: question
    criterion_key: artifact.support.place_setting_sheet.utility
    text: Can it support continuity checks and drafting without requiring lore excavation?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  tags: []
modifier_actions: []
research_basis:
- cho_et_al_2026_bineval
- zhang_et_al_2026_rubricbench
notes:
- Derived from the supplied application rubric inventory and refined into atomic positive binary questions.
- YES means the observable criterion is satisfied; NOT_APPLICABLE and CANNOT_ASSESS are control states, not quality
  labels.
source_description: Evaluates spatial usability, sensory identity, history, social function, constraints, narrative
  opportunities, and links to actual scenes.
