$schema: ../schema/hbq_rubric.schema.json
standard:
  id: HBQ-RS
  version: 1.2.0
module_id: form.poetry.rondeau
version: 1
title: Rondeau
kind: artifact_form
description: Research-informed binary rubric for rondeau.
origin: research_expansion
owner_domains:
- form.poetry.rondeau
artifact_types:
- poetry
