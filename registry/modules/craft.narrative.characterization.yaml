$schema: ../schema/hbq_rubric.schema.json
standard:
  id: HBQ-RS
  version: 1.0.0
module_id: craft.narrative.characterization
version: 1
title: Characterization
kind: craft
description: Evaluates dimensionality, behavioral specificity, motives, contradictions, agency, development, distinction
  among characters, and fidelity to character sheets and prior behavior.
origin: user_inventory_refined
owner_domains:
- narrative.characterization
artifact_types:
- prose_fiction
- creative_nonfiction
- dramatic_writing
- narrative_poetry
- interactive_fiction
valid_scopes:
- beat
- scene
- chapter
- sequence
- act
- manuscript
- series
activation: Attach when characterization is relevant to the active artifact or operation.
requires: []
incompatible_with: []
default_evidence_scope:
  current_artifact: true
  neighboring_units: 0
  project_sources: when supplied
tree:
- id: craft.narrative.characterization.quality
  type: group
  title: Characterization
  score_mode: weighted_mean
  weight: 1.0
  children:
  - id: craft.narrative.characterization.dimensionality
    type: question
    criterion_key: craft.narrative.characterization.dimensionality
    text: Do major characters possess multiple relevant traits, motives, pressures, or loyalties?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: craft.narrative.characterization.behavior
    type: question
    criterion_key: craft.narrative.characterization.behavior
    text: Are characters revealed through specific behavior, choices, attention, language, or relationships?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: craft.narrative.characterization.motives
    type: question
    criterion_key: craft.narrative.characterization.motives
    text: Are motives legible enough to make choices meaningful without being overexplained?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: craft.narrative.characterization.contradiction
    type: question
    criterion_key: craft.narrative.characterization.contradiction
    text: Do contradictions or mixed motives add credible complexity rather than random inconsistency?
    pass_answer: 'YES'
    weight: 1.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: craft.narrative.characterization.agency
    type: question
    criterion_key: craft.narrative.characterization.agency
    text: Do important characters make consequential choices rather than functioning only as plot furniture?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: craft.narrative.characterization.distinction
    type: question
    criterion_key: craft.narrative.characterization.distinction
    text: Can characters be distinguished by more than names, labels, and superficial quirks?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: craft.narrative.characterization.development
    type: question
    criterion_key: craft.narrative.characterization.development
    text: At the available scope, is new character information, pressure, or change meaningfully developed?
    pass_answer: 'YES'
    weight: 1.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: craft.narrative.characterization.canon
    type: question
    criterion_key: craft.narrative.characterization.canon
    text: Do character actions and voices remain faithful to supplied sheets and prior behavior unless change is
      earned?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: craft.narrative.characterization.no_trait_labels
    type: question
    criterion_key: craft.narrative.characterization.no_trait_labels
    text: Does the text avoid relying on direct trait labels where dramatized evidence is needed?
    pass_answer: 'YES'
    weight: 1.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  tags: []
modifier_actions: []
research_basis:
- cho_et_al_2026_bineval
- zhang_et_al_2026_rubricbench
- vaezi_rezaei_2018
- carey_davidow_williams_2022
- gomez_rodriguez_williams_2023
- fein_et_al_2026_litbench
notes:
- Derived from the supplied application rubric inventory and refined into atomic positive binary questions.
- YES means the observable criterion is satisfied; NOT_APPLICABLE and CANNOT_ASSESS are control states, not quality
  labels.
source_description: Evaluates dimensionality, behavioral specificity, motives, contradictions, agency, development,
  distinction among characters, and fidelity to character sheets and prior behavior.
