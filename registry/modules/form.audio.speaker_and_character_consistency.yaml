$schema: ../schema/hbq_rubric.schema.json
standard:
  id: HBQ-RS
  version: 1.2.1
module_id: form.audio.speaker_and_character_consistency
version: 1
title: Speaker and character consistency
kind: audio_artifact
description: Research-informed binary rubric for speaker and character consistency.
origin: research_expansion
owner_domains:
- audio.speaker_and_character_consistency
artifact_types:
