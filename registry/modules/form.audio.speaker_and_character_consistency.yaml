    type: question
    criterion_key: form.audio.speaker_and_character_consistency.emotion
    text: Is identity preserved under emotional change?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: form.audio.speaker_and_character_consistency.register
    type: question
