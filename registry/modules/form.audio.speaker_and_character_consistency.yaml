    type: question
    criterion_key: form.audio.speaker_and_character_consistency.identity
    text: Does each speaker remain recognizably the same across segments?
    pass_answer: 'YES'
    weight: 2.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
