$schema: ../schema/hbq_rubric.schema.json
standard:
  id: HBQ-RS
  version: 1.0.0
module_id: core.mechanics_and_presentation
version: 1
title: Mechanics and presentation
kind: base
description: 'Covers grammar, punctuation, spelling, formatting, dialogue mechanics, typography, and output cleanliness.
  Its importance changes sharply by phase: low during brainstorming, high during finalization.'
origin: user_inventory_refined
owner_domains:
- mechanics
artifact_types:
- any
valid_scopes:
- any
activation: Attach to every substantive execution.
requires: []
incompatible_with: []
