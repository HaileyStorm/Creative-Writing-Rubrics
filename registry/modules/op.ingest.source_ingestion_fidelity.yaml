$schema: ../schema/hbq_rubric.schema.json
standard:
  id: HBQ-RS
  version: 1.2.1
module_id: op.ingest.source_ingestion_fidelity
version: 1
title: Source ingestion fidelity
kind: procedure
description: Checks whether imported text, notes, formatting, headings, ordering, metadata, and distinctions between
  source and inferred information were preserved.
origin: user_inventory_refined
owner_domains:
- procedure.source_ingestion_fidelity
artifact_types:
- any
valid_scopes:
- operation
activation: Attach when source ingestion fidelity is relevant to the active artifact or operation.
requires: []
incompatible_with: []
default_evidence_scope:
  current_artifact: true
  neighboring_units: 0
  project_sources: when supplied
tree:
- id: op.ingest.source_ingestion_fidelity.quality
  type: group
  title: Source ingestion fidelity checks
  score_mode: weighted_mean
  weight: 1.0
  children:
  - id: op.ingest.source_ingestion_fidelity.text
    type: question
    criterion_key: op.ingest.source_ingestion_fidelity.text
    text: Is source text preserved exactly except for explicitly authorized normalization?
    pass_answer: 'YES'
    weight: 2.0
    question_type: hard_gate
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.ingest.source_ingestion_fidelity.order
    type: question
    criterion_key: op.ingest.source_ingestion_fidelity.order
    text: Are source ordering and hierarchy preserved?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.ingest.source_ingestion_fidelity.format
    type: question
    criterion_key: op.ingest.source_ingestion_fidelity.format
    text: Are meaningful headings, lists, tables, emphasis, and formatting distinctions preserved?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.ingest.source_ingestion_fidelity.metadata
    type: question
    criterion_key: op.ingest.source_ingestion_fidelity.metadata
    text: Is available source metadata retained and attached to the correct content?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.ingest.source_ingestion_fidelity.versions
    type: question
    criterion_key: op.ingest.source_ingestion_fidelity.versions
    text: Are alternate drafts, superseded notes, and authoritative versions kept distinct?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.ingest.source_ingestion_fidelity.source_inference
    type: question
    criterion_key: op.ingest.source_ingestion_fidelity.source_inference
    text: Are source-derived statements clearly distinguished from inference or model-generated additions?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.ingest.source_ingestion_fidelity.no_omission
    type: question
    criterion_key: op.ingest.source_ingestion_fidelity.no_omission
    text: Is no material content silently omitted?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.ingest.source_ingestion_fidelity.no_invention
    type: question
    criterion_key: op.ingest.source_ingestion_fidelity.no_invention
    text: Is no unsupported content inserted into the ingested source?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  tags: []
modifier_actions: []
research_basis:
- cho_et_al_2026_bineval
- zhang_et_al_2026_rubricbench
- wu_et_al_2025_writingbench
- fein_et_al_2026_litbench
notes:
- Derived from the supplied application rubric inventory and refined into atomic positive binary questions.
- YES means the observable criterion is satisfied; NOT_APPLICABLE and CANNOT_ASSESS are control states, not quality
  labels.
source_description: Checks whether imported text, notes, formatting, headings, ordering, metadata, and distinctions
  between source and inferred information were preserved.
