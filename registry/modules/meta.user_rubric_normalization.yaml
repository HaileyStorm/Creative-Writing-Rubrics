$schema: ../schema/hbq_rubric.schema.json
standard:
  id: HBQ-RS
  version: 1.0.0
module_id: meta.user_rubric_normalization
version: 1
title: User-rubric normalization and validation
kind: meta_rubric
description: Validates, atomizes, deduplicates, and safely merges user-supplied rubrics with the built-in registry.
origin: user_inventory_refined
owner_domains:
- rubric_normalization
artifact_types:
- rubric
valid_scopes:
- rubric
activation: Run whenever a user imports or edits a rubric.
requires: []
incompatible_with: []
default_evidence_scope:
  current_artifact: true
  neighboring_units: 0
  project_sources: when supplied
tree:
- id: meta.user_rubric_normalization.quality
  type: group
  title: Rubric validation
  score_mode: weighted_mean
  weight: 1.0
  children:
  - id: meta.user_rubric_normalization.scope
    type: question
    criterion_key: meta.user_rubric_normalization.scope
    text: Does the imported rubric state which artifact types, operations, phases, and scopes it applies to?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: meta.user_rubric_normalization.observable
    type: question
    criterion_key: meta.user_rubric_normalization.observable
    text: Is each criterion observable in the evidence the judge will receive?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: meta.user_rubric_normalization.atomic
    type: question
    criterion_key: meta.user_rubric_normalization.atomic
    text: Is each scored criterion decomposed into one atomic positive binary question?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: meta.user_rubric_normalization.owner
    type: question
    criterion_key: meta.user_rubric_normalization.owner
    text: Does every criterion have exactly one scoring owner?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: meta.user_rubric_normalization.duplicates
    type: question
    criterion_key: meta.user_rubric_normalization.duplicates
    text: Are duplicates and overlaps with built-in modules removed or explicitly replaced?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: meta.user_rubric_normalization.conflicts
    type: question
    criterion_key: meta.user_rubric_normalization.conflicts
    text: Are conflicts with project constraints, preservation rules, form profiles, and procedure goals exposed?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: meta.user_rubric_normalization.essential
    type: question
    criterion_key: meta.user_rubric_normalization.essential
    text: Are missing essential dimensions or hard constraints identified?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: meta.user_rubric_normalization.gate
    type: question
    criterion_key: meta.user_rubric_normalization.gate
    text: Is each item correctly classified as hard gate, scored question, subjective threshold, diagnostic, or
      bounded penalty?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: meta.user_rubric_normalization.extract
    type: question
    criterion_key: meta.user_rubric_normalization.extract
    text: Does the rubric avoid judging an excerpt as though it were a complete manuscript?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: meta.user_rubric_normalization.merge
    type: question
    criterion_key: meta.user_rubric_normalization.merge
    text: Is replacement, supplement, disablement, reweighting, and lifetime scope explicit?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: meta.user_rubric_normalization.formula
    type: question
    criterion_key: meta.user_rubric_normalization.formula
    text: Are weights, caps, N/A handling, coverage, and score formulas valid?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: meta.user_rubric_normalization.version
    type: question
    criterion_key: meta.user_rubric_normalization.version
    text: Is the normalized rubric versioned and traceable to its imported source?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  tags: []
modifier_actions: []
research_basis:
- cho_et_al_2026_bineval
- zhang_et_al_2026_rubricbench
- rao_callison_burch_2026_autorubric
notes: []
