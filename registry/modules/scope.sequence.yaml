$schema: ../schema/hbq_rubric.schema.json
standard:
  id: HBQ-RS
  version: 1.2.1
module_id: scope.sequence
version: 1
title: Multi-chapter sequence or arc scope overlay
kind: scope_overlay
description: For several chapters, an episode, movement, subplot, or story arc.
origin: user_inventory_refined
owner_domains:
- scope.sequence
artifact_types:
- any
valid_scopes:
- sequence
activation: Attach when the evaluated scope is sequence.
requires: []
incompatible_with: []
default_evidence_scope:
  current_artifact: true
  neighboring_units: 0
  project_sources: when supplied
tree:
- id: scope.sequence.quality
  type: group
  title: Scope handling
  score_mode: weighted_mean
  weight: 1.0
  children:
  - id: scope.sequence.progression
    type: question
    criterion_key: scope.sequence.progression
    text: Do units accumulate into a clear larger progression?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: scope.sequence.escalation
    type: question
    criterion_key: scope.sequence.escalation
    text: Do pressure and consequence develop rather than reset?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: scope.sequence.variation
    type: question
    criterion_key: scope.sequence.variation
    text: Do unit functions, modes, intensities, and settings vary appropriately?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: scope.sequence.character
    type: question
    criterion_key: scope.sequence.character
    text: Does character or relationship movement accumulate across units?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: scope.sequence.setup
    type: question
    criterion_key: scope.sequence.setup
    text: Are setup and payoff relations maintained across the sequence?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: scope.sequence.pacing
    type: question
    criterion_key: scope.sequence.pacing
    text: Does the sequence have effective pacing waves and proportional allocation?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: scope.sequence.closure
    type: question
    criterion_key: scope.sequence.closure
    text: Does the selected arc reach an appropriate local resolution or new state?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: scope.sequence.larger
    type: question
    criterion_key: scope.sequence.larger
    text: Does it remain integrated with the larger work?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  tags: []
modifier_actions:
- action: minimum_neighboring_units
  value: 1
research_basis:
- cho_et_al_2026_bineval
- longjudgebench_2026
notes: []
