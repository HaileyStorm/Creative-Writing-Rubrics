$schema: ../schema/hbq_rubric.schema.json
standard:
  id: HBQ-RS
  version: 1.2.1
module_id: model.release.long_context_retention
version: 1
title: Long-context retention
kind: model_build
description: Covers MRCR/MNIAH-style retrieval, RULER, NoLiMa, narrative continuity, conflicting updates, and manuscript
  revision through at least 128K.
origin: user_inventory_refined
owner_domains:
- model.long_context_retention
artifact_types:
- model_build
valid_scopes:
- any
activation: Attach when long-context retention is relevant to the active artifact or operation.
requires: []
incompatible_with: []
default_evidence_scope:
  current_artifact: true
  neighboring_units: 0
  project_sources: when supplied
tree:
- id: model.release.long_context_retention.quality
  type: group
  title: Long-context retention checks
  score_mode: weighted_mean
  weight: 1.0
  children:
  - id: model.release.long_context_retention.single
    type: question
    criterion_key: model.release.long_context_retention.single
    text: Are distant facts retrievable at required context lengths?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: model.release.long_context_retention.distractors
    type: question
    criterion_key: model.release.long_context_retention.distractors
    text: Are facts retrievable among similar distractors?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: model.release.long_context_retention.multi
    type: question
    criterion_key: model.release.long_context_retention.multi
    text: Can multiple dispersed narrative needles be tracked together?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: model.release.long_context_retention.updates
    type: question
    criterion_key: model.release.long_context_retention.updates
    text: Do later state updates correctly supersede earlier states?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: model.release.long_context_retention.synthesis
    type: question
    criterion_key: model.release.long_context_retention.synthesis
    text: Can evidence be synthesized across documents and units?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: model.release.long_context_retention.continuity
    type: question
    criterion_key: model.release.long_context_retention.continuity
    text: Is narrative continuity preserved through at least the target context length?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: model.release.long_context_retention.conflict
    type: question
    criterion_key: model.release.long_context_retention.conflict
    text: Are conflicts and uncertainty identified rather than resolved by first mention or recency bias?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  tags: []
