$schema: ../schema/hbq_rubric.schema.json
standard:
  id: HBQ-RS
  version: 1.2.0
module_id: scope.poetry_line
version: 1
title: Poetry line scope overlay
kind: scope_overlay
description: For one poetic line; emphasizes sound, stress, syntax, image, line break, and local function.
origin: user_inventory_refined
owner_domains:
- scope.poetry_line
artifact_types:
- any
valid_scopes:
- poetry_line
activation: Attach when the evaluated scope is poetry_line.
requires: []
incompatible_with: []
default_evidence_scope:
  current_artifact: true
  neighboring_units: 0
  project_sources: when supplied
tree:
- id: scope.poetry_line.quality
  type: group
  title: Scope handling
  score_mode: weighted_mean
  weight: 1.0
  children:
  - id: scope.poetry_line.sound
    type: question
    criterion_key: scope.poetry_line.sound
    text: Do sound and stress contribute to the line's effect?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: scope.poetry_line.syntax
    type: question
    criterion_key: scope.poetry_line.syntax
    text: Does syntax cooperate productively with the line boundary?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: scope.poetry_line.image
    type: question
    criterion_key: scope.poetry_line.image
    text: Does the line contribute precise image, thought, voice, or movement?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: scope.poetry_line.break
    type: question
    criterion_key: scope.poetry_line.break
    text: Is the line break meaningful in the supplied context?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: scope.poetry_line.fit
    type: question
    criterion_key: scope.poetry_line.fit
    text: Does the line fit surrounding rhythm, tone, and image system?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: scope.poetry_line.limits
    type: question
    criterion_key: scope.poetry_line.limits
    text: Does the judge avoid whole-poem claims not supported by one line?
    pass_answer: 'YES'
    weight: 2.0
    question_type: diagnostic
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  tags: []
modifier_actions:
- action: disable_owner_domains
  domains:
  - whole_poem_movement
  - collection_architecture
research_basis:
- cho_et_al_2026_bineval
- longjudgebench_2026
notes: []
