$schema: ../schema/hbq_rubric.schema.json
standard:
  id: HBQ-RS
  version: 1.2.1
module_id: data.eval.evaluation_determinism
version: 1
title: Evaluation determinism
kind: dataset_eval
description: Ensures fixed IDs, seeds, tokenization policies, official scorers, unit-test environments, exact normalization
  rules, and reproducible aggregation.
origin: user_inventory_refined
owner_domains:
- dataset.evaluation_determinism
artifact_types:
- dataset
- evaluation_pipeline
valid_scopes:
- any
activation: Attach when evaluation determinism is relevant to the active artifact or operation.
requires: []
incompatible_with: []
default_evidence_scope:
  current_artifact: true
  neighboring_units: 0
  project_sources: when supplied
tree:
- id: data.eval.evaluation_determinism.quality
  type: group
  title: Evaluation determinism checks
  score_mode: weighted_mean
  weight: 1.0
  children:
  - id: data.eval.evaluation_determinism.ids
    type: question
    criterion_key: data.eval.evaluation_determinism.ids
    text: Are evaluation item IDs and splits fixed?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: data.eval.evaluation_determinism.seeds
    type: question
    criterion_key: data.eval.evaluation_determinism.seeds
    text: Are random seeds and sampling settings fixed or fully recorded?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: data.eval.evaluation_determinism.tokenization
    type: question
    criterion_key: data.eval.evaluation_determinism.tokenization
    text: Are tokenization and length policies fixed?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: data.eval.evaluation_determinism.scorers
    type: question
    criterion_key: data.eval.evaluation_determinism.scorers
    text: Are official scorer and unit-test versions pinned?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: data.eval.evaluation_determinism.normalize
    type: question
    criterion_key: data.eval.evaluation_determinism.normalize
    text: Are normalization and aggregation rules exact and versioned?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: data.eval.evaluation_determinism.environment
    type: question
    criterion_key: data.eval.evaluation_determinism.environment
    text: Is the execution environment reproducible?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: data.eval.evaluation_determinism.rerun
    type: question
    criterion_key: data.eval.evaluation_determinism.rerun
    text: Do repeated runs produce identical or tolerance-bounded results?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  tags: []
modifier_actions: []
research_basis:
- cho_et_al_2026_bineval
- zhang_et_al_2026_rubricbench
- rao_callison_burch_2026_autorubric
- longjudgebench_2026
notes:
- Derived from the supplied application rubric inventory and refined into atomic positive binary questions.
- YES means the observable criterion is satisfied; NOT_APPLICABLE and CANNOT_ASSESS are control states, not quality
  labels.
source_description: Ensures fixed IDs, seeds, tokenization policies, official scorers, unit-test environments, exact
  normalization rules, and reproducible aggregation.
