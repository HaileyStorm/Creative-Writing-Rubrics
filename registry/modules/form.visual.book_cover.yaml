    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: form.visual.book_cover.technical
    type: question
    criterion_key: form.visual.book_cover.technical
    text: Does it satisfy trim, bleed, spine, resolution, and safe-area requirements?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
