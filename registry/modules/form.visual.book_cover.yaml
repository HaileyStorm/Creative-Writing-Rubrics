  - id: form.visual.book_cover.composition
    type: question
    criterion_key: form.visual.book_cover.composition
    text: Does composition create intrigue without misleading plot claims?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
