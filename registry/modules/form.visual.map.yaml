      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: form.visual.map.style
    type: question
    criterion_key: form.visual.map.style
    text: Does the map style fit the world and publication context?
    pass_answer: 'YES'
    weight: 1.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: form.visual.map.uncertainty
    type: question
    criterion_key: form.visual.map.uncertainty
    text: Are unknown, disputed, approximate, or perspective-dependent regions represented appropriately?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
