  - id: modifier.genre.action_adventure.escalation
    type: question
    criterion_key: modifier.genre.action_adventure.escalation
    text: Does action escalate or vary through changed constraints rather than repeat equivalent exchanges?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
