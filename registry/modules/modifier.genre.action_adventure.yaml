    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: modifier.genre.action_adventure.rhythm
    type: question
    criterion_key: modifier.genre.action_adventure.rhythm
    text: Does sentence and paragraph rhythm support clarity and intensity?
    pass_answer: 'YES'
