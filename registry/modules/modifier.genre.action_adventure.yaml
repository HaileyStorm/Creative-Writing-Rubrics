$schema: ../schema/hbq_rubric.schema.json
standard:
  id: HBQ-RS
  version: 1.0.0
module_id: modifier.genre.action_adventure
version: 1
title: Action / adventure
kind: modifier
description: Spatial intelligibility, objective, obstacle, escalation, tactical consequence, physical continuity,
  variation, and character meaning inside action.
origin: user_inventory_refined
owner_domains:
- genre.action_adventure
artifact_types:
- creative_text
valid_scopes:
- any
activation: Attach when action / adventure is relevant to the active artifact or operation.
requires: []
incompatible_with: []
default_evidence_scope:
  current_artifact: true
  neighboring_units: 0
  project_sources: when supplied
tree:
- id: modifier.genre.action_adventure.quality
  type: group
  title: Action / adventure contract
  score_mode: weighted_mean
  weight: 1.0
  children:
  - id: modifier.genre.action_adventure.objective
    type: question
    criterion_key: modifier.genre.action_adventure.objective
    text: Is the immediate objective clear during action?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: modifier.genre.action_adventure.space
    type: question
    criterion_key: modifier.genre.action_adventure.space
    text: Can the reader track relevant positions, movement, obstacles, and environment?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
