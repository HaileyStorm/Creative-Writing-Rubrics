    type: question
    criterion_key: modifier.genre.action_adventure.no_choreography_dump
    text: Does the work avoid exhaustive move-by-move choreography without strategic or emotional significance?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
