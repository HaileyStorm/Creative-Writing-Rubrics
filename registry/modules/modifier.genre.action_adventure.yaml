    tags: []
  - id: modifier.genre.action_adventure.tactics
    type: question
    criterion_key: modifier.genre.action_adventure.tactics
    text: Do characters make situation-specific tactical choices?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
