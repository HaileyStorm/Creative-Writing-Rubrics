$schema: ../schema/hbq_rubric.schema.json
standard:
  id: HBQ-RS
  version: 1.2.1
module_id: artifact.support.outline
version: 1
title: Outline
kind: support_artifact
description: Uses the coarse, medium, or fine-detail procedure rubric described below. It must be judged as a planning
  instrument, not as prose.
origin: user_inventory_refined
owner_domains:
- support.outline
artifact_types:
- planning_artifact
- reference_artifact
valid_scopes:
- any
activation: Attach when outline is relevant to the active artifact or operation.
requires: []
incompatible_with: []
default_evidence_scope:
  current_artifact: true
  neighboring_units: 0
  project_sources: when supplied
tree:
- id: artifact.support.outline.quality
  type: group
  title: Outline checks
  score_mode: weighted_mean
  weight: 1.0
  children:
  - id: artifact.support.outline.instrument
    type: question
    criterion_key: artifact.support.outline.instrument
    text: Does the outline function as a usable planning instrument rather than polished prose or a vague summary?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: artifact.support.outline.level
    type: question
    criterion_key: artifact.support.outline.level
    text: Is its granularity appropriate to the requested coarse, medium, or fine level?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: artifact.support.outline.causality
    type: question
    criterion_key: artifact.support.outline.causality
    text: Does it make major causal relationships and dependencies visible?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: artifact.support.outline.state
    type: question
    criterion_key: artifact.support.outline.state
    text: Does it track relevant starting and resulting states?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: artifact.support.outline.arcs
    type: question
    criterion_key: artifact.support.outline.arcs
    text: Does it show the movement of central arcs at the chosen granularity?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: artifact.support.outline.gaps
    type: question
    criterion_key: artifact.support.outline.gaps
    text: Does it expose unresolved decisions and uncertainties rather than conceal them with false precision?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: artifact.support.outline.alignment
    type: question
    criterion_key: artifact.support.outline.alignment
    text: Is it consistent with authoritative project material?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  tags: []
modifier_actions: []
research_basis:
- cho_et_al_2026_bineval
- zhang_et_al_2026_rubricbench
notes:
- Derived from the supplied application rubric inventory and refined into atomic positive binary questions.
- YES means the observable criterion is satisfied; NOT_APPLICABLE and CANNOT_ASSESS are control states, not quality
  labels.
source_description: Uses the coarse, medium, or fine-detail procedure rubric described below. It must be judged
  as a planning instrument, not as prose.
