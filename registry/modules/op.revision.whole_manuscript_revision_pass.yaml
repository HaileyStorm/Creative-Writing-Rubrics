    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.revision.whole_manuscript_revision_pass.voice
    type: question
    criterion_key: op.revision.whole_manuscript_revision_pass.voice
    text: Is voice preserved and normalized only where drift was actually defective?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.revision.whole_manuscript_revision_pass.threads
    type: question
    criterion_key: op.revision.whole_manuscript_revision_pass.threads
    text: Are setups, payoffs, motifs, and unresolved threads updated across distance?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.revision.whole_manuscript_revision_pass.continuity
    type: question
    criterion_key: op.revision.whole_manuscript_revision_pass.continuity
    text: Are chronology, knowledge, injuries, objects, and relationships rechecked after revision?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.revision.whole_manuscript_revision_pass.new_patterns
    type: question
    criterion_key: op.revision.whole_manuscript_revision_pass.new_patterns
    text: Has the pass checked for new repetition, pacing imbalance, or tonal flattening introduced by repeated
