$schema: ../schema/hbq_rubric.schema.json
standard:
  id: HBQ-RS
  version: 1.2.0
module_id: form.poetry.elegy
version: 1
title: Elegy
kind: artifact_form
description: Research-informed binary rubric for elegy.
