$schema: ../schema/hbq_rubric.schema.json
standard:
  id: HBQ-RS
  version: 1.0.0
module_id: op.draft.reference_style_or_project_voice_drafting
version: 1
title: Reference-style or project-voice drafting
kind: procedure
description: Evaluates feature-level fidelity—rhythm, syntax, imagery, distance, tone, dialogue practice—without
  reducing style to copied phrases or superficial markers.
origin: user_inventory_refined
owner_domains:
- procedure.reference_style_or_project_voice_drafting
artifact_types:
- any
valid_scopes:
- operation
activation: Attach when reference-style or project-voice drafting is relevant to the active artifact or operation.
requires: []
incompatible_with: []
default_evidence_scope:
  current_artifact: true
  neighboring_units: 0
  project_sources: when supplied
tree:
- id: op.draft.reference_style_or_project_voice_drafting.quality
  type: group
  title: Reference-style or project-voice drafting checks
  score_mode: weighted_mean
  weight: 1.0
  children:
  - id: op.draft.reference_style_or_project_voice_drafting.features
    type: question
    criterion_key: op.draft.reference_style_or_project_voice_drafting.features
    text: Does the draft reproduce the requested feature-level profile—rhythm, syntax, diction, imagery, distance,
      tone, and dialogue practice?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.draft.reference_style_or_project_voice_drafting.project
    type: question
    criterion_key: op.draft.reference_style_or_project_voice_drafting.project
    text: Does it remain compatible with the active project's own voice and purpose?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.draft.reference_style_or_project_voice_drafting.content
    type: question
    criterion_key: op.draft.reference_style_or_project_voice_drafting.content
    text: Does style emerge through original content suited to the current scene or artifact?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.draft.reference_style_or_project_voice_drafting.consistency
    type: question
    criterion_key: op.draft.reference_style_or_project_voice_drafting.consistency
    text: Is the style sustained beyond a few conspicuous markers?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.draft.reference_style_or_project_voice_drafting.subtlety
    type: question
    criterion_key: op.draft.reference_style_or_project_voice_drafting.subtlety
    text: Are stylistic features integrated rather than announced or exaggerated?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.draft.reference_style_or_project_voice_drafting.no_phrase_copy
    type: question
    criterion_key: op.draft.reference_style_or_project_voice_drafting.no_phrase_copy
    text: Does it avoid copying distinctive phrases or close passage structures from a living or requested reference
      author?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.draft.reference_style_or_project_voice_drafting.no_caricature
    type: question
    criterion_key: op.draft.reference_style_or_project_voice_drafting.no_caricature
    text: Does it avoid reducing the style to superficial tics, archaic words, fragments, or ornamental metaphors?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  tags: []
modifier_actions: []
research_basis:
- cho_et_al_2026_bineval
- zhang_et_al_2026_rubricbench
- wu_et_al_2025_writingbench
- fein_et_al_2026_litbench
notes:
- Derived from the supplied application rubric inventory and refined into atomic positive binary questions.
- YES means the observable criterion is satisfied; NOT_APPLICABLE and CANNOT_ASSESS are control states, not quality
  labels.
source_description: Evaluates feature-level fidelity—rhythm, syntax, imagery, distance, tone, dialogue practice—without
  reducing style to copied phrases or superficial markers.
