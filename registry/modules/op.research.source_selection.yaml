$schema: ../schema/hbq_rubric.schema.json
standard:
  id: HBQ-RS
  version: 1.2.0
module_id: op.research.source_selection
version: 1
title: Source selection
kind: procedure
description: Evaluates authority, recency where relevant, primary versus secondary status, diversity, applicability,
  and likely bias.
origin: user_inventory_refined
owner_domains:
- procedure.source_selection
artifact_types:
- any
valid_scopes:
- operation
activation: Attach when source selection is relevant to the active artifact or operation.
requires: []
incompatible_with: []
default_evidence_scope:
  current_artifact: true
  neighboring_units: 0
  project_sources: when supplied
tree:
- id: op.research.source_selection.quality
  type: group
  title: Source selection checks
  score_mode: weighted_mean
  weight: 1.0
  children:
  - id: op.research.source_selection.authority
    type: question
    criterion_key: op.research.source_selection.authority
    text: Are selected sources authoritative for the claim type?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.research.source_selection.primary
    type: question
    criterion_key: op.research.source_selection.primary
    text: Are primary sources used where they materially improve accuracy?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.research.source_selection.recency
    type: question
    criterion_key: op.research.source_selection.recency
    text: Are sources current enough for time-sensitive facts?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.research.source_selection.diversity
    type: question
    criterion_key: op.research.source_selection.diversity
    text: Are relevant perspectives and source types represented where the topic is contested or culturally situated?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.research.source_selection.bias
    type: question
    criterion_key: op.research.source_selection.bias
    text: Are likely incentives, limitations, and biases identified?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.research.source_selection.applicability
    type: question
    criterion_key: op.research.source_selection.applicability
    text: Do sources apply to the exact period, place, population, technology, or practice in question?
    pass_answer: 'YES'
    weight: 2.0
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  - id: op.research.source_selection.traceable
    type: question
    criterion_key: op.research.source_selection.traceable
    text: Can all sourced claims be traced to a stable reference?
    pass_answer: 'YES'
    weight: 1.5
    question_type: scored
    severity: material
    applies_when: The criterion is relevant to the requested artifact, scope, and operation.
    evidence_policy:
      required: true
      minimum_references: 1
      reference_style: artifact span, unit ID, timestamp, or source ID
    tags: []
  tags: []
modifier_actions: []
research_basis:
- cho_et_al_2026_bineval
- zhang_et_al_2026_rubricbench
- wu_et_al_2025_writingbench
- fein_et_al_2026_litbench
notes:
- Derived from the supplied application rubric inventory and refined into atomic positive binary questions.
- YES means the observable criterion is satisfied; NOT_APPLICABLE and CANNOT_ASSESS are control states, not quality
  labels.
source_description: Evaluates authority, recency where relevant, primary versus secondary status, diversity, applicability,
  and likely bias.
