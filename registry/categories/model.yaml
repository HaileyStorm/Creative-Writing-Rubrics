- $schema: ../schema/hbq_rubric.schema.json
  standard:
    id: HBQ-RS
    version: 1.2.0
  module_id: model.release.code_capability_retention
  version: 1
  title: Code capability retention
  kind: model_build
  description: Protects the designated code slice and catches specialist experts lost during REAP.
  origin: user_inventory_refined
  owner_domains:
  - model.code_capability_retention
  artifact_types:
  - model_build
  valid_scopes:
  - any
  activation: Attach when code capability retention is relevant to the active artifact or operation.
  requires: []
  incompatible_with: []
  default_evidence_scope:
    current_artifact: true
    neighboring_units: 0
    project_sources: when supplied
  tree:
  - id: model.release.code_capability_retention.quality
    type: group
    title: Code capability retention checks
    score_mode: weighted_mean
    weight: 1.0
    children:
    - id: model.release.code_capability_retention.slice
      type: question
      criterion_key: model.release.code_capability_retention.slice
      text: Does the modified model meet the protected code-suite threshold?
      pass_answer: 'YES'
      weight: 2.0
      question_type: scored
      severity: material
      applies_when: The criterion is relevant to the requested artifact, scope, and operation.
      evidence_policy:
        required: true
        minimum_references: 1
        reference_style: artifact span, unit ID, timestamp, or source ID
      tags: []
    - id: model.release.code_capability_retention.tails
      type: question
      criterion_key: model.release.code_capability_retention.tails
      text: Are specialist language, framework, debugging, and repository-level tails preserved?
      pass_answer: 'YES'
      weight: 2.0
      question_type: scored
      severity: material
      applies_when: The criterion is relevant to the requested artifact, scope, and operation.
      evidence_policy:
        required: true
        minimum_references: 1
        reference_style: artifact span, unit ID, timestamp, or source ID
      tags: []
    - id: model.release.code_capability_retention.constraints
      type: question
      criterion_key: model.release.code_capability_retention.constraints
      text: Does it retain instruction and edit constraints in code tasks?
      pass_answer: 'YES'
      weight: 1.5
      question_type: scored
      severity: material
      applies_when: The criterion is relevant to the requested artifact, scope, and operation.
      evidence_policy:
        required: true
        minimum_references: 1
        reference_style: artifact span, unit ID, timestamp, or source ID
      tags: []
    - id: model.release.code_capability_retention.tests
      type: question
      criterion_key: model.release.code_capability_retention.tests
      text: Do generated changes pass deterministic tests and static checks?
      pass_answer: 'YES'
      weight: 2.0
      question_type: scored
      severity: material
      applies_when: The criterion is relevant to the requested artifact, scope, and operation.
      evidence_policy:
        required: true
        minimum_references: 1
        reference_style: artifact span, unit ID, timestamp, or source ID
      tags: []
    - id: model.release.code_capability_retention.long
      type: question
      criterion_key: model.release.code_capability_retention.long
      text: Does it retain repository and long-context code reasoning?
      pass_answer: 'YES'
      weight: 1.5
      question_type: scored
      severity: material
      applies_when: The criterion is relevant to the requested artifact, scope, and operation.
      evidence_policy:
        required: true
        minimum_references: 1
        reference_style: artifact span, unit ID, timestamp, or source ID
      tags: []
    - id: model.release.code_capability_retention.baseline
      type: question
      criterion_key: model.release.code_capability_retention.baseline
      text: Are results compared against source and same-stage baselines?
      pass_answer: 'YES'
      weight: 1.5
      question_type: scored
      severity: material
      applies_when: The criterion is relevant to the requested artifact, scope, and operation.
      evidence_policy:
        required: true
        minimum_references: 1
        reference_style: artifact span, unit ID, timestamp, or source ID
      tags: []
    - id: model.release.code_capability_retention.variance
      type: question
      criterion_key: model.release.code_capability_retention.variance
      text: Are repeated-run variance and decoding sensitivity reported?
      pass_answer: 'YES'
      weight: 1.0
      question_type: scored
      severity: material
      applies_when: The criterion is relevant to the requested artifact, scope, and operation.
      evidence_policy:
        required: true
        minimum_references: 1
        reference_style: artifact span, unit ID, timestamp, or source ID
      tags: []
    tags: []
  modifier_actions: []
  research_basis:
  - cho_et_al_2026_bineval
  - zhang_et_al_2026_rubricbench
  - rao_callison_burch_2026_autorubric
  - longjudgebench_2026
  notes:
  - Derived from the supplied application rubric inventory and refined into atomic positive binary questions.
  - YES means the observable criterion is satisfied; NOT_APPLICABLE and CANNOT_ASSESS are control states, not quality
    labels.
  source_description: Protects the designated code slice and catches specialist experts lost during REAP.
