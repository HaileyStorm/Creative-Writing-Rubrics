      pass_answer: 'YES'
      weight: 1.5
      question_type: scored
      severity: material
      applies_when: The criterion is relevant to the requested artifact, scope, and operation.
      evidence_policy:
        required: true
        minimum_references: 1
        reference_style: artifact span, unit ID, timestamp, or source ID
      tags: []
    - id: artifact.support.synopsis.arc
      type: question
      criterion_key: artifact.support.synopsis.arc
      text: Does it show the central character or relationship arc?
      pass_answer: 'YES'
      weight: 1.5
      question_type: scored
      severity: material
      applies_when: The criterion is relevant to the requested artifact, scope, and operation.
      evidence_policy:
        required: true
        minimum_references: 1
        reference_style: artifact span, unit ID, timestamp, or source ID
      tags: []
    - id: artifact.support.synopsis.proportion
      type: question
      criterion_key: artifact.support.synopsis.proportion
      text: Is space allocated in proportion to narrative importance?
      pass_answer: 'YES'
      weight: 1.5
      question_type: scored
      severity: material
      applies_when: The criterion is relevant to the requested artifact, scope, and operation.
      evidence_policy:
        required: true
        minimum_references: 1
        reference_style: artifact span, unit ID, timestamp, or source ID
      tags: []
    - id: artifact.support.synopsis.clarity
      type: question
      criterion_key: artifact.support.synopsis.clarity
      text: Can the synopsis be followed without consulting the manuscript?
      pass_answer: 'YES'
      weight: 1.5
      question_type: scored
      severity: material
      applies_when: The criterion is relevant to the requested artifact, scope, and operation.
      evidence_policy:
        required: true
        minimum_references: 1
        reference_style: artifact span, unit ID, timestamp, or source ID
      tags: []
    - id: artifact.support.synopsis.accuracy
      type: question
      criterion_key: artifact.support.synopsis.accuracy
      text: Does it accurately represent the current manuscript version?
      pass_answer: 'YES'
      weight: 2.0
      question_type: scored
      severity: material
      applies_when: The criterion is relevant to the requested artifact, scope, and operation.
      evidence_policy:
        required: true
        minimum_references: 1
        reference_style: artifact span, unit ID, timestamp, or source ID
      tags: []
    - id: artifact.support.synopsis.no_teaser
      type: question
      criterion_key: artifact.support.synopsis.no_teaser
