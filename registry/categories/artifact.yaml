    current_artifact: true
    neighboring_units: 0
    project_sources: when supplied
  tree:
  - id: artifact.support.character_sheet.quality
    type: group
    title: Character sheet checks
    score_mode: weighted_mean
    weight: 1.0
    children:
    - id: artifact.support.character_sheet.specificity
      type: question
      criterion_key: artifact.support.character_sheet.specificity
      text: Does the sheet contain specific, distinguishing information rather than generic trait lists?
