    score_mode: weighted_mean
    weight: 1.0
    children:
    - id: form.audio.audio_drama_production.intelligible
      type: question
      criterion_key: form.audio.audio_drama_production.intelligible
      text: Can listeners follow dialogue, speakers, action, and location without visual support?
      pass_answer: 'YES'
      weight: 2.0
      question_type: scored
      severity: material
      applies_when: The criterion is relevant to the requested artifact, scope, and operation.
      evidence_policy:
        required: true
        minimum_references: 1
        reference_style: artifact span, unit ID, timestamp, or source ID
      tags: []
    - id: form.audio.audio_drama_production.voices
      type: question
      criterion_key: form.audio.audio_drama_production.voices
      text: Are speakers distinct and consistent?
      pass_answer: 'YES'
      weight: 1.5
      question_type: scored
      severity: material
      applies_when: The criterion is relevant to the requested artifact, scope, and operation.
      evidence_policy:
        required: true
        minimum_references: 1
        reference_style: artifact span, unit ID, timestamp, or source ID
      tags: []
    - id: form.audio.audio_drama_production.blocking
      type: question
      criterion_key: form.audio.audio_drama_production.blocking
      text: Do spatialization, movement, and sound cues make action intelligible?
      pass_answer: 'YES'
      weight: 1.5
      question_type: scored
      severity: material
      applies_when: The criterion is relevant to the requested artifact, scope, and operation.
      evidence_policy:
        required: true
        minimum_references: 1
        reference_style: artifact span, unit ID, timestamp, or source ID
      tags: []
    - id: form.audio.audio_drama_production.sound
      type: question
      criterion_key: form.audio.audio_drama_production.sound
      text: Do sound effects and ambience carry narrative information rather than decorate indiscriminately?
      pass_answer: 'YES'
      weight: 1.5
      question_type: scored
      severity: material
      applies_when: The criterion is relevant to the requested artifact, scope, and operation.
      evidence_policy:
        required: true
        minimum_references: 1
        reference_style: artifact span, unit ID, timestamp, or source ID
      tags: []
    - id: form.audio.audio_drama_production.music
      type: question
      criterion_key: form.audio.audio_drama_production.music
      text: Does music support structure and emotion without obscuring speech or dictating feeling?
      pass_answer: 'YES'
      weight: 1.5
      question_type: scored
      severity: material
      applies_when: The criterion is relevant to the requested artifact, scope, and operation.
      evidence_policy:
        required: true
        minimum_references: 1
        reference_style: artifact span, unit ID, timestamp, or source ID
      tags: []
    - id: form.audio.audio_drama_production.pace
      type: question
      criterion_key: form.audio.audio_drama_production.pace
      text: Do dialogue, silence, transitions, and sound create effective dramatic timing?
      pass_answer: 'YES'
      weight: 1.5
      question_type: scored
      severity: material
      applies_when: The criterion is relevant to the requested artifact, scope, and operation.
      evidence_policy:
        required: true
        minimum_references: 1
        reference_style: artifact span, unit ID, timestamp, or source ID
      tags: []
    - id: form.audio.audio_drama_production.mix
      type: question
      criterion_key: form.audio.audio_drama_production.mix
      text: Are levels, frequency balance, dynamics, and stereo field coherent and accessible?
      pass_answer: 'YES'
      weight: 2.0
      question_type: scored
      severity: material
      applies_when: The criterion is relevant to the requested artifact, scope, and operation.
      evidence_policy:
        required: true
        minimum_references: 1
