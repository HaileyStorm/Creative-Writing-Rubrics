  - Derived from the supplied application rubric inventory and refined into atomic positive binary questions.
  - YES means the observable criterion is satisfied; NOT_APPLICABLE and CANNOT_ASSESS are control states, not quality
    labels.
  source_description: Used whenever an existing artifact is modified. It distinguishes requested changes, necessary
    supporting changes, optional improvements, and unauthorized alterations. This is especially important for the
    restrained final-pass role.
