- $schema: ../schema/hbq_rubric.schema.json
  standard:
    id: HBQ-RS
    version: 1.2.0
  module_id: core.audience_and_purpose_fit
  version: 1
  title: Audience and purpose fit
  kind: base
  description: 'Evaluates whether complexity, tone, explanation, intensity, vocabulary, length, and genre signaling
    fit the intended audience and use: private draft, literary submission, children’s story, serial fiction, performance
    piece, etc.'
  origin: user_inventory_refined
  owner_domains:
  - audience_purpose
  artifact_types:
  - any
  valid_scopes:
  - any
  activation: Attach to every substantive execution.
  requires: []
  incompatible_with: []
  default_evidence_scope:
    current_artifact: true
    neighboring_units: 0
    project_sources: when supplied
  tree:
  - id: core.audience_and_purpose_fit.quality
    type: group
    title: Audience and purpose fit
    score_mode: weighted_mean
    weight: 1.0
    children:
    - id: core.audience_and_purpose_fit.complexity
      type: question
      criterion_key: core.audience_and_purpose_fit.complexity
      text: Is conceptual and structural complexity appropriate for the intended audience?
      pass_answer: 'YES'
      weight: 1.0
      question_type: scored
      severity: material
      applies_when: The criterion is relevant to the requested artifact, scope, and operation.
      evidence_policy:
        required: true
        minimum_references: 1
        reference_style: artifact span, unit ID, timestamp, or source ID
      tags: []
    - id: core.audience_and_purpose_fit.tone
      type: question
      criterion_key: core.audience_and_purpose_fit.tone
      text: Is tone appropriate for the intended audience, venue, and purpose?
      pass_answer: 'YES'
      weight: 1.5
      question_type: scored
      severity: material
      applies_when: The criterion is relevant to the requested artifact, scope, and operation.
      evidence_policy:
        required: true
        minimum_references: 1
