- $schema: ../schema/hbq_rubric.schema.json
  standard:
    id: HBQ-RS
    version: 1.2.0
  module_id: core.change_authorization
  version: 1
  title: Change authorization
  kind: base
  description: Used whenever an existing artifact is modified. It distinguishes requested changes, necessary supporting
    changes, optional improvements, and unauthorized alterations. This is especially important for the restrained
    final-pass role.
  origin: user_inventory_refined
  owner_domains:
  - change_authorization
  artifact_types:
  - any
  valid_scopes:
  - any
  activation: Attach to every substantive execution.
