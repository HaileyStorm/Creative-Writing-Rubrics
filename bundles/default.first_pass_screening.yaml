$schema: ../schema/hbq_bundle.schema.json
standard:
  id: HBQ-RS
  version: 1.2.1
bundle_id: default.first_pass_screening
version: 1
title: First-pass screening
description: Fast elimination of clearly noncompliant, incoherent, repetitive, canon-breaking, or functionally weak
  candidates.
artifact_types:
- candidate
valid_scopes:
- micro
- passage
- scene
- chapter
- artifact
profile: {}
task_contract_domain_id: hard
module_ids:
- core.task_and_brief_fidelity
- core.substantive_task_engagement_true_non_refusal
- core.coherence_and_comprehensibility
- core.project_and_source_fidelity
- core.internal_logic_and_plausibility
- core.freshness_and_non_genericness
- core.economy_and_relevance
- op.select.first_pass_screening_grade
- core.mechanics_and_presentation
- op.select.candidate_usefulness
- core.holistic_artistic_success
- penalty.repetition
- penalty.unflagged_incomplete
domains:
- domain_id: hard
  title: Task and hard constraints
  points: 16.0
  components:
  - module_id: core.task_and_brief_fidelity
    weight: 1.0
  - module_id: core.substantive_task_engagement_true_non_refusal
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: coherence
  title: Coherence
  points: 16.0
  components:
  - module_id: core.coherence_and_comprehensibility
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: canon
  title: Canon and logic
  points: 14.0
  components:
  - module_id: core.project_and_source_fidelity
    weight: 1.0
  - module_id: core.internal_logic_and_plausibility
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: generic
  title: Freshness and repetition
  points: 16.0
  components:
  - module_id: core.freshness_and_non_genericness
    weight: 1.0
  - module_id: core.economy_and_relevance
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: function
  title: Artifact or scene function
  points: 18.0
  components:
  - module_id: op.select.first_pass_screening_grade
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: mechanics
  title: Fatal mechanics and presentation
  points: 8.0
  components:
  - module_id: core.mechanics_and_presentation
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: utility
  title: Candidate usefulness
  points: 4.0
  components:
  - module_id: op.select.candidate_usefulness
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: holistic
  title: Compact holistic success
  points: 8.0
  components:
  - module_id: core.holistic_artistic_success
    weight: 1.0
  score_mode: weighted_binary_mean
penalty_modules:
- module_id: penalty.repetition
  cap_points: 5.0
- module_id: penalty.unflagged_incomplete
  cap_points: 8.0
hard_gate_policy:
  no_is_invalid: true
  cannot_assess_is_unresolved: true
  not_applicable_requires_condition_or_reason: true
  hard_gates_are_reported_separately: true
coverage_policy:
  minimum_weighted_coverage: 0.82
  below_threshold_status: PROVISIONAL
  score_interval_required_when_unassessed: true
  whole_work_claims_require_whole_work_evidence: true
excerpt_and_incomplete_policy:
  flagged_excerpt: Do not penalize absent whole-work completion. Mark unavailable whole-work criteria CANNOT_ASSESS
    or NOT_APPLICABLE as appropriate.
  unflagged_incomplete: Apply the bounded unflagged-incomplete penalty when the artifact is presented as complete
    or partial status is omitted.
  visible_local_defects: Score defects visible in the supplied extract normally.
judge_policy:
  artifact_assumed_ai_generated: true
  strict_but_fair: true
  no_glazing: true
  judge_execution_not_intent: true
  do_not_invent_defects: true
  avoid_length_and_ornament_bias: true
  brief_evidence_required: true
  private_chain_of_thought_not_requested: true
  verdict_states:
  - 'YES'
  - 'NO'
  - NOT_APPLICABLE
  - CANNOT_ASSESS
  pairwise_finalists: false
notes: []
