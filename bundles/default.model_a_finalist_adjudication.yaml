$schema: ../schema/hbq_bundle.schema.json
standard:
  id: HBQ-RS
  version: 1.2.1
bundle_id: default.model_a_finalist_adjudication
version: 1
title: Finalist adjudication
description: High-context, evidence-rich adjudication of strong finalists, followed by controlled pairwise comparison.
artifact_types:
- candidate
valid_scopes:
- passage
- scene
- chapter
- artifact
- manuscript
profile: {}
module_ids:
- core.task_and_brief_fidelity
- core.length_and_scope_fit
- core.coherence_and_comprehensibility
- core.language_craft
- core.internal_logic_and_plausibility
- core.voice_and_stylistic_identity
- core.freshness_and_non_genericness
- core.specificity_and_embodiment
- core.emotional_and_intellectual_effect
- core.project_and_source_fidelity
- core.audience_and_purpose_fit
- op.select.full_adjudication_grade
- op.select.pairwise_comparison
- op.select.tie_break_selection
- op.select.judge_confidence_and_evidence_quality
- core.holistic_artistic_success
- op.select.rubric_application_quality
domains:
- domain_id: task
  title: Task and scope
  points: 8.0
  components:
  - module_id: core.task_and_brief_fidelity
    weight: 1.0
  - module_id: core.length_and_scope_fit
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: craft
  title: Applicable craft
  points: 24.0
  components:
  - module_id: core.coherence_and_comprehensibility
    weight: 1.0
  - module_id: core.language_craft
    weight: 1.0
  - module_id: core.internal_logic_and_plausibility
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: identity
  title: Voice, freshness, and specificity
  points: 18.0
  components:
  - module_id: core.voice_and_stylistic_identity
    weight: 1.0
  - module_id: core.freshness_and_non_genericness
    weight: 1.0
  - module_id: core.specificity_and_embodiment
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: effect
  title: Emotional and intellectual effect
  points: 14.0
  components:
  - module_id: core.emotional_and_intellectual_effect
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: project
  title: Project and audience fit
  points: 12.0
  components:
  - module_id: core.project_and_source_fidelity
    weight: 1.0
  - module_id: core.audience_and_purpose_fit
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: comparison
  title: Direct tradeoffs and selection
  points: 12.0
  components:
  - module_id: op.select.full_adjudication_grade
    weight: 1.0
  - module_id: op.select.pairwise_comparison
    weight: 1.0
  - module_id: op.select.tie_break_selection
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: confidence
  title: Evidence and confidence
  points: 4.0
  components:
  - module_id: op.select.judge_confidence_and_evidence_quality
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: holistic
  title: Holistic artistic success
  points: 8.0
  components:
  - module_id: core.holistic_artistic_success
    weight: 1.0
  score_mode: weighted_binary_mean
penalty_modules: []
hard_gate_policy:
  no_is_invalid: true
  cannot_assess_is_unresolved: true
  not_applicable_requires_condition_or_reason: true
  hard_gates_are_reported_separately: true
coverage_policy:
  minimum_weighted_coverage: 0.92
  below_threshold_status: PROVISIONAL
  score_interval_required_when_unassessed: true
  whole_work_claims_require_whole_work_evidence: true
excerpt_and_incomplete_policy:
  flagged_excerpt: Do not penalize absent whole-work completion. Mark unavailable whole-work criteria CANNOT_ASSESS
    or NOT_APPLICABLE as appropriate.
  unflagged_incomplete: Apply the bounded unflagged-incomplete penalty when the artifact is presented as complete
    or partial status is omitted.
  visible_local_defects: Score defects visible in the supplied extract normally.
judge_policy:
  artifact_assumed_ai_generated: true
  strict_but_fair: true
  no_glazing: true
  judge_execution_not_intent: true
  do_not_invent_defects: true
  avoid_length_and_ornament_bias: true
  brief_evidence_required: true
  private_chain_of_thought_not_requested: true
  verdict_states:
  - 'YES'
  - 'NO'
  - NOT_APPLICABLE
  - CANNOT_ASSESS
  pairwise_finalists: true
notes: []
