$schema: ../schema/hbq_bundle.schema.json
standard:
  id: HBQ-RS
  version: 1.0.0
bundle_id: default.ideation
version: 1
title: Ideation
description: Generates a useful, varied, project-relevant idea set without confusing novelty with quality.
artifact_types:
- idea_set
valid_scopes:
- artifact
profile: {}
module_ids:
- core.task_and_brief_fidelity
- core.substantive_task_engagement_true_non_refusal
- op.ideation.brainstorm_idea_set_quality
- core.freshness_and_non_genericness
- artifact.support.premise_story_seed
- op.ideation.premise_stress_test
- core.audience_and_purpose_fit
- op.select.candidate_set_coverage
- sampler.batch_diversity
- op.select.candidate_usefulness
- core.holistic_artistic_success
- modifier.preference.user_taste
domains:
- domain_id: task
  title: Task and brief
  points: 8.0
  components:
  - module_id: core.task_and_brief_fidelity
    weight: 1.0
  - module_id: core.substantive_task_engagement_true_non_refusal
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: set
  title: Idea-set quality
  points: 24.0
  components:
  - module_id: op.ideation.brainstorm_idea_set_quality
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: freshness
  title: Freshness
  points: 14.0
  components:
  - module_id: core.freshness_and_non_genericness
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: potential
  title: Premise potential
  points: 16.0
  components:
  - module_id: artifact.support.premise_story_seed
    weight: 1.0
  - module_id: op.ideation.premise_stress_test
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: fit
  title: Audience and genre fit
  points: 10.0
  components:
  - module_id: core.audience_and_purpose_fit
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: diversity
  title: Candidate diversity
  points: 12.0
  components:
  - module_id: op.select.candidate_set_coverage
    weight: 1.0
  - module_id: sampler.batch_diversity
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: utility
  title: Substantive utility
  points: 8.0
  components:
  - module_id: op.select.candidate_usefulness
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: holistic
  title: Holistic artistic promise
  points: 8.0
  components:
  - module_id: core.holistic_artistic_success
    weight: 1.0
  score_mode: weighted_binary_mean
penalty_modules: []
hard_gate_policy:
  no_is_invalid: true
  cannot_assess_is_unresolved: true
  not_applicable_requires_condition_or_reason: true
  hard_gates_are_reported_separately: true
coverage_policy:
  minimum_weighted_coverage: 0.85
  below_threshold_status: PROVISIONAL
  score_interval_required_when_unassessed: true
  whole_work_claims_require_whole_work_evidence: true
excerpt_and_incomplete_policy:
  flagged_excerpt: Do not penalize absent whole-work completion. Mark unavailable whole-work criteria CANNOT_ASSESS
    or NOT_APPLICABLE as appropriate.
  unflagged_incomplete: Apply the bounded unflagged-incomplete penalty when the artifact is presented as complete
    or partial status is omitted.
  visible_local_defects: Score defects visible in the supplied extract normally.
judge_policy:
  artifact_assumed_ai_generated: true
  strict_but_fair: true
  no_glazing: true
  judge_execution_not_intent: true
  do_not_invent_defects: true
  avoid_length_and_ornament_bias: true
  brief_evidence_required: true
  private_chain_of_thought_not_requested: true
  verdict_states:
  - 'YES'
  - 'NO'
  - NOT_APPLICABLE
  - CANNOT_ASSESS
  pairwise_finalists: false
notes: []
