$schema: ../schema/hbq_bundle.schema.json
standard:
  id: HBQ-RS
  version: 1.0.0
bundle_id: default.coarse_outline
version: 1
title: Coarse outline
description: Evaluates a premise-scale skeleton, major turns, causal chain, principal arcs, and ending direction.
artifact_types:
- outline
valid_scopes:
- artifact
- project
profile: {}
module_ids:
- core.task_and_brief_fidelity
- core.length_and_scope_fit
- op.outline.coarse_outline
- craft.narrative.plot_and_causality
- craft.narrative.character_arc
- core.internal_logic_and_plausibility
- craft.narrative.pacing_and_narrative_time
- core.audience_and_purpose_fit
- core.project_and_source_fidelity
- op.outline.outline_consistency
- core.holistic_artistic_success
domains:
- domain_id: task
  title: Task and scope
  points: 8.0
  components:
  - module_id: core.task_and_brief_fidelity
    weight: 1.0
  - module_id: core.length_and_scope_fit
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: skeleton
  title: Coarse-outline utility
  points: 24.0
  components:
  - module_id: op.outline.coarse_outline
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: causality
  title: Plot and causality
  points: 18.0
  components:
  - module_id: craft.narrative.plot_and_causality
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: arcs
  title: Character arcs
  points: 14.0
  components:
  - module_id: craft.narrative.character_arc
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: proportion
  title: Structural proportion
  points: 12.0
  components:
  - module_id: core.internal_logic_and_plausibility
    weight: 1.0
  - module_id: craft.narrative.pacing_and_narrative_time
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: promise
  title: Genre and audience promise
  points: 8.0
  components:
  - module_id: core.audience_and_purpose_fit
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: project
  title: Project fidelity
  points: 8.0
  components:
  - module_id: core.project_and_source_fidelity
    weight: 1.0
  - module_id: op.outline.outline_consistency
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: holistic
  title: Holistic planning usefulness
  points: 8.0
  components:
  - module_id: core.holistic_artistic_success
    weight: 1.0
  score_mode: weighted_binary_mean
penalty_modules: []
hard_gate_policy:
  no_is_invalid: true
  cannot_assess_is_unresolved: true
  not_applicable_requires_condition_or_reason: true
  hard_gates_are_reported_separately: true
coverage_policy:
  minimum_weighted_coverage: 0.9
  below_threshold_status: PROVISIONAL
  score_interval_required_when_unassessed: true
  whole_work_claims_require_whole_work_evidence: true
excerpt_and_incomplete_policy:
  flagged_excerpt: Do not penalize absent whole-work completion. Mark unavailable whole-work criteria CANNOT_ASSESS
    or NOT_APPLICABLE as appropriate.
  unflagged_incomplete: Apply the bounded unflagged-incomplete penalty when the artifact is presented as complete
    or partial status is omitted.
  visible_local_defects: Score defects visible in the supplied extract normally.
judge_policy:
  artifact_assumed_ai_generated: true
  strict_but_fair: true
  no_glazing: true
  judge_execution_not_intent: true
  do_not_invent_defects: true
  avoid_length_and_ornament_bias: true
  brief_evidence_required: true
  private_chain_of_thought_not_requested: true
  verdict_states:
  - 'YES'
  - 'NO'
  - NOT_APPLICABLE
  - CANNOT_ASSESS
  pairwise_finalists: false
notes: []
