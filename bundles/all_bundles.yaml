- $schema: ../schema/hbq_bundle.schema.json
  standard:
    id: HBQ-RS
    version: 1.0.0
  bundle_id: audio.audiobook
  version: 1
  title: Audiobook narration
  description: Direct-audio evaluation for audiobook narration.
  artifact_types:
  - audio_asset
  valid_scopes:
  - utterance
  - passage
  - scene
  - chapter
  - work
  profile: {}
  module_ids:
  - core.task_and_brief_fidelity
  - form.audio.speech_text_fidelity
  - form.audio.audiobook_narration
  - form.audio.prosody_and_emotional_expression
  - form.audio.speaker_and_character_consistency
  - form.audio.speech_naturalness_and_intelligibility
  - form.audio.audio_technical_mastering
  - core.project_and_source_fidelity
  - core.audience_and_purpose_fit
  - core.holistic_artistic_success
  - penalty.repetition
  - penalty.unflagged_incomplete
  domains:
  - domain_id: task
    title: Text and direction fidelity
    points: 14.0
    components:
    - module_id: core.task_and_brief_fidelity
      weight: 1.0
    - module_id: form.audio.speech_text_fidelity
      weight: 1.0
    score_mode: weighted_binary_mean
  - domain_id: performance
    title: Role fit and performance
    points: 18.0
    components:
    - module_id: form.audio.audiobook_narration
      weight: 1.0
      include_question_ids:
      - form.audio.audiobook_narration.natural
      - form.audio.audiobook_narration.meaning
      - form.audio.audiobook_narration.narrator
      - form.audio.audiobook_narration.characters
      - form.audio.audiobook_narration.emotion
      - form.audio.audiobook_narration.pace
    - module_id: form.audio.prosody_and_emotional_expression
      weight: 1.0
    score_mode: weighted_binary_mean
  - domain_id: voice
    title: Speaker and character consistency
    points: 14.0
    components:
    - module_id: form.audio.speaker_and_character_consistency
      weight: 1.0
    score_mode: weighted_binary_mean
  - domain_id: natural
    title: Naturalness and intelligibility
    points: 16.0
    components:
    - module_id: form.audio.speech_naturalness_and_intelligibility
      weight: 1.0
    score_mode: weighted_binary_mean
  - domain_id: long
    title: Long-form stability and pacing
    points: 12.0
    components:
    - module_id: form.audio.audiobook_narration
      weight: 1.0
      include_question_ids:
      - form.audio.audiobook_narration.long
    score_mode: weighted_binary_mean
  - domain_id: sound
    title: Acoustic and mastering quality
    points: 10.0
    components:
    - module_id: form.audio.audio_technical_mastering
      weight: 1.0
    score_mode: weighted_binary_mean
  - domain_id: project
    title: Project and audience fit
    points: 8.0
    components:
    - module_id: core.project_and_source_fidelity
      weight: 1.0
    - module_id: core.audience_and_purpose_fit
      weight: 1.0
    score_mode: weighted_binary_mean
  - domain_id: holistic
    title: Holistic listening success
    points: 8.0
    components:
    - module_id: core.holistic_artistic_success
      weight: 1.0
    score_mode: weighted_binary_mean
  penalty_modules:
  - module_id: penalty.repetition
    cap_points: 8.0
  - module_id: penalty.unflagged_incomplete
    cap_points: 8.0
  hard_gate_policy:
    no_is_invalid: true
    cannot_assess_is_unresolved: true
    not_applicable_requires_condition_or_reason: true
    hard_gates_are_reported_separately: true
  coverage_policy:
    minimum_weighted_coverage: 0.88
    below_threshold_status: PROVISIONAL
    score_interval_required_when_unassessed: true
    whole_work_claims_require_whole_work_evidence: true
  excerpt_and_incomplete_policy:
    flagged_excerpt: Do not penalize absent whole-work completion. Mark unavailable whole-work criteria CANNOT_ASSESS
      or NOT_APPLICABLE as appropriate.
    unflagged_incomplete: Apply the bounded unflagged-incomplete penalty when the artifact is presented as complete
      or partial status is omitted.
    visible_local_defects: Score defects visible in the supplied extract normally.
  judge_policy:
    artifact_assumed_ai_generated: true
    strict_but_fair: true
    no_glazing: true
    judge_execution_not_intent: true
    do_not_invent_defects: true
    avoid_length_and_ornament_bias: true
    brief_evidence_required: true
    private_chain_of_thought_not_requested: true
    verdict_states:
    - 'YES'
    - 'NO'
    - NOT_APPLICABLE
    - CANNOT_ASSESS
    pairwise_finalists: false
  notes: []
