$schema: ../schema/hbq_bundle.schema.json
standard:
  id: HBQ-RS
  version: 1.2.0
bundle_id: default.full_manuscript_critique
version: 1
title: Full-manuscript critique
description: Hierarchical manuscript critique with whole-work mapping, thread tracking, stratified evidence, and
  prioritized revision strategy.
artifact_types:
- manuscript
valid_scopes:
- manuscript
profile: {}
task_contract_domain_id: scope
module_ids:
- scope.manuscript
- op.critique.full_manuscript_critique
- op.select.judge_confidence_and_evidence_quality
- op.critique.structural_audit
- craft.narrative.plot_and_causality
- craft.narrative.characterization
- craft.narrative.character_arc
- craft.narrative.pacing_and_narrative_time
- craft.narrative.exposition_and_information_management
- core.voice_and_stylistic_identity
- core.language_craft
- op.critique.style_drift_audit
- craft.narrative.continuity_and_canon_integrity
- craft.narrative.foreshadowing_setup_and_payoff
- craft.narrative.theme_and_subtext
- core.emotional_and_intellectual_effect
- artifact.support.revision_plan
- core.holistic_artistic_success
- penalty.purple_prose
- penalty.repetition
- penalty.unflagged_incomplete
- scope.long_context
domains:
- domain_id: scope
  title: Scope, evidence, and method
  points: 10.0
  components:
  - module_id: scope.manuscript
    weight: 1.0
  - module_id: op.critique.full_manuscript_critique
    weight: 1.0
  - module_id: op.select.judge_confidence_and_evidence_quality
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: structure
  title: Global structure and causality
  points: 18.0
  components:
  - module_id: op.critique.structural_audit
    weight: 1.0
  - module_id: craft.narrative.plot_and_causality
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: character
  title: Character and relationship arcs
  points: 14.0
  components:
  - module_id: craft.narrative.characterization
    weight: 1.0
  - module_id: craft.narrative.character_arc
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: pacing
  title: Pacing and information
  points: 12.0
  components:
  - module_id: craft.narrative.pacing_and_narrative_time
    weight: 1.0
  - module_id: craft.narrative.exposition_and_information_management
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: voice
  title: Voice, language, and recurring patterns
  points: 12.0
  components:
  - module_id: core.voice_and_stylistic_identity
    weight: 1.0
  - module_id: core.language_craft
    weight: 1.0
  - module_id: op.critique.style_drift_audit
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: canon
  title: Continuity, canon, and threads
  points: 12.0
  components:
  - module_id: craft.narrative.continuity_and_canon_integrity
    weight: 1.0
  - module_id: craft.narrative.foreshadowing_setup_and_payoff
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: effect
  title: Theme and reader effect
  points: 10.0
  components:
  - module_id: craft.narrative.theme_and_subtext
    weight: 1.0
  - module_id: core.emotional_and_intellectual_effect
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: strategy
  title: Prioritized revision strategy
  points: 4.0
  components:
  - module_id: artifact.support.revision_plan
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: holistic
  title: Holistic artistic success
  points: 8.0
  components:
  - module_id: core.holistic_artistic_success
    weight: 1.0
  score_mode: weighted_binary_mean
penalty_modules:
- module_id: penalty.purple_prose
  cap_points: 5.0
- module_id: penalty.repetition
  cap_points: 8.0
- module_id: penalty.unflagged_incomplete
  cap_points: 8.0
hard_gate_policy:
  no_is_invalid: true
  cannot_assess_is_unresolved: true
  not_applicable_requires_condition_or_reason: true
  hard_gates_are_reported_separately: true
coverage_policy:
  minimum_weighted_coverage: 0.8
  below_threshold_status: PROVISIONAL
  score_interval_required_when_unassessed: true
  whole_work_claims_require_whole_work_evidence: true
excerpt_and_incomplete_policy:
  flagged_excerpt: Do not penalize absent whole-work completion. Mark unavailable whole-work criteria CANNOT_ASSESS
    or NOT_APPLICABLE as appropriate.
  unflagged_incomplete: Apply the bounded unflagged-incomplete penalty when the artifact is presented as complete
    or partial status is omitted.
  visible_local_defects: Score defects visible in the supplied extract normally.
judge_policy:
  artifact_assumed_ai_generated: true
  strict_but_fair: true
  no_glazing: true
  judge_execution_not_intent: true
  do_not_invent_defects: true
  avoid_length_and_ornament_bias: true
  brief_evidence_required: true
  private_chain_of_thought_not_requested: true
  verdict_states:
  - 'YES'
  - 'NO'
  - NOT_APPLICABLE
  - CANNOT_ASSESS
  pairwise_finalists: false
notes:
- A manuscript score is not the arithmetic mean of chapter scores.
