$schema: ../schema/hbq_bundle.schema.json
standard:
  id: HBQ-RS
  version: 1.0.0
bundle_id: default.research_task
version: 1
title: Research task
description: Evaluates research question, source quality, synthesis, uncertainty, provenance, and direct writing
  utility.
artifact_types:
- research_artifact
valid_scopes:
- artifact
- project
profile: {}
module_ids:
- core.task_and_brief_fidelity
- op.research.research_question_formulation
- op.research.source_selection
- op.critique.research_and_factuality_audit
- op.research.research_synthesis
- op.ingest.context_provenance
- op.research.research_to_fiction_application
- core.holistic_artistic_success
domains:
- domain_id: task
  title: Question and task fidelity
  points: 10.0
  components:
  - module_id: core.task_and_brief_fidelity
    weight: 1.0
  - module_id: op.research.research_question_formulation
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: sources
  title: Source selection
  points: 18.0
  components:
  - module_id: op.research.source_selection
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: accuracy
  title: Factual accuracy and distinctions
  points: 20.0
  components:
  - module_id: op.critique.research_and_factuality_audit
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: synthesis
  title: Synthesis
  points: 18.0
  components:
  - module_id: op.research.research_synthesis
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: uncertainty
  title: Uncertainty and provenance
  points: 14.0
  components:
  - module_id: op.ingest.context_provenance
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: application
  title: Usefulness to fiction
  points: 12.0
  components:
  - module_id: op.research.research_to_fiction_application
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: holistic
  title: Holistic research usefulness
  points: 8.0
  components:
  - module_id: core.holistic_artistic_success
    weight: 1.0
  score_mode: weighted_binary_mean
penalty_modules: []
hard_gate_policy:
  no_is_invalid: true
  cannot_assess_is_unresolved: true
  not_applicable_requires_condition_or_reason: true
  hard_gates_are_reported_separately: true
coverage_policy:
  minimum_weighted_coverage: 0.94
  below_threshold_status: PROVISIONAL
  score_interval_required_when_unassessed: true
  whole_work_claims_require_whole_work_evidence: true
excerpt_and_incomplete_policy:
  flagged_excerpt: Do not penalize absent whole-work completion. Mark unavailable whole-work criteria CANNOT_ASSESS
    or NOT_APPLICABLE as appropriate.
  unflagged_incomplete: Apply the bounded unflagged-incomplete penalty when the artifact is presented as complete
    or partial status is omitted.
  visible_local_defects: Score defects visible in the supplied extract normally.
judge_policy:
  artifact_assumed_ai_generated: true
  strict_but_fair: true
  no_glazing: true
  judge_execution_not_intent: true
  do_not_invent_defects: true
  avoid_length_and_ornament_bias: true
  brief_evidence_required: true
  private_chain_of_thought_not_requested: true
  verdict_states:
  - 'YES'
  - 'NO'
  - NOT_APPLICABLE
  - CANNOT_ASSESS
  pairwise_finalists: false
notes: []
