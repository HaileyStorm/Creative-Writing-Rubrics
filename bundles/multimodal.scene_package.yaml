$schema: ../schema/hbq_bundle.schema.json
standard:
  id: HBQ-RS
  version: 1.2.1
bundle_id: multimodal.scene_package
version: 1
title: Multimodal scene package
description: Joint evaluation of scene text, illustration, narration, and cross-modal canon/alignment.
artifact_types:
- multimodal_asset
valid_scopes:
- scene
- sequence
profile: {}
module_ids:
- core.task_and_brief_fidelity
- form.multimodal.multimodal_scene_package
- form.prose.general_prose_fiction
- craft.narrative.scene_construction
- form.visual.scene_illustration
- form.multimodal.text_image_alignment
- form.audio.audiobook_narration
- form.multimodal.text_audio_alignment
- form.multimodal.cross_modal_canon_integrity
- form.multimodal.illustration_placement_and_pacing
- form.multimodal.accessibility_metadata
- core.holistic_artistic_success
- penalty.repetition
- penalty.unflagged_incomplete
domains:
- domain_id: task
  title: Brief and package completeness
  points: 10.0
  components:
  - module_id: core.task_and_brief_fidelity
    weight: 1.0
  - module_id: form.multimodal.multimodal_scene_package
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: text
  title: Text quality
  points: 16.0
  components:
  - module_id: form.prose.general_prose_fiction
    weight: 1.0
  - module_id: craft.narrative.scene_construction
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: image
  title: Image quality and alignment
  points: 16.0
  components:
  - module_id: form.visual.scene_illustration
    weight: 1.0
  - module_id: form.multimodal.text_image_alignment
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: audio
  title: Narration quality and alignment
  points: 16.0
  components:
  - module_id: form.audio.audiobook_narration
    weight: 1.0
  - module_id: form.multimodal.text_audio_alignment
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: canon
  title: Cross-modal canon integrity
  points: 18.0
  components:
  - module_id: form.multimodal.cross_modal_canon_integrity
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: pacing
  title: Placement and pacing
  points: 10.0
  components:
  - module_id: form.multimodal.illustration_placement_and_pacing
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: access
  title: Accessibility and metadata
  points: 6.0
  components:
  - module_id: form.multimodal.accessibility_metadata
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: holistic
  title: Holistic multimodal success
  points: 8.0
  components:
  - module_id: core.holistic_artistic_success
    weight: 1.0
  score_mode: weighted_binary_mean
penalty_modules:
- module_id: penalty.repetition
  cap_points: 6.0
- module_id: penalty.unflagged_incomplete
  cap_points: 8.0
hard_gate_policy:
  no_is_invalid: true
  cannot_assess_is_unresolved: true
  not_applicable_requires_condition_or_reason: true
  hard_gates_are_reported_separately: true
coverage_policy:
  minimum_weighted_coverage: 0.85
  below_threshold_status: PROVISIONAL
  score_interval_required_when_unassessed: true
  whole_work_claims_require_whole_work_evidence: true
excerpt_and_incomplete_policy:
  flagged_excerpt: Do not penalize absent whole-work completion. Mark unavailable whole-work criteria CANNOT_ASSESS
    or NOT_APPLICABLE as appropriate.
  unflagged_incomplete: Apply the bounded unflagged-incomplete penalty when the artifact is presented as complete
    or partial status is omitted.
  visible_local_defects: Score defects visible in the supplied extract normally.
judge_policy:
  artifact_assumed_ai_generated: true
  strict_but_fair: true
  no_glazing: true
  judge_execution_not_intent: true
  do_not_invent_defects: true
  avoid_length_and_ornament_bias: true
  brief_evidence_required: true
  private_chain_of_thought_not_requested: true
  verdict_states:
  - 'YES'
  - 'NO'
  - NOT_APPLICABLE
  - CANNOT_ASSESS
  pairwise_finalists: false
notes: []
