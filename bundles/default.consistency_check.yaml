$schema: ../schema/hbq_bundle.schema.json
standard:
  id: HBQ-RS
  version: 1.0.0
bundle_id: default.consistency_check
version: 1
title: Consistency check and repair proposals
description: Audits canon, timeline, character knowledge, logistics, and source authority, then proposes minimal
  repairs.
artifact_types:
- creative_text
- project_corpus
valid_scopes:
- passage
- scene
- chapter
- sequence
- manuscript
- series
profile: {}
module_ids:
- core.task_and_brief_fidelity
- op.critique.consistency_audit
- craft.narrative.continuity_and_canon_integrity
- craft.narrative.temporal_and_spatial_continuity
- core.project_and_source_fidelity
- op.ingest.context_provenance
- craft.narrative.characterization
- core.internal_logic_and_plausibility
- op.select.judge_confidence_and_evidence_quality
- op.revision.continuity_repair
- op.revision.revision_note_quality
- core.holistic_artistic_success
domains:
- domain_id: task
  title: Task and scope
  points: 8.0
  components:
  - module_id: core.task_and_brief_fidelity
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: canon
  title: Canon integrity
  points: 22.0
  components:
  - module_id: op.critique.consistency_audit
    weight: 1.0
  - module_id: craft.narrative.continuity_and_canon_integrity
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: time_space
  title: Time, space, and state
  points: 18.0
  components:
  - module_id: craft.narrative.temporal_and_spatial_continuity
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: sources
  title: Source authority and provenance
  points: 14.0
  components:
  - module_id: core.project_and_source_fidelity
    weight: 1.0
  - module_id: op.ingest.context_provenance
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: character
  title: Knowledge and motivation
  points: 12.0
  components:
  - module_id: craft.narrative.characterization
    weight: 1.0
  - module_id: core.internal_logic_and_plausibility
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: severity
  title: Issue evidence and severity
  points: 10.0
  components:
  - module_id: op.select.judge_confidence_and_evidence_quality
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: repair
  title: Repair minimality and actionability
  points: 8.0
  components:
  - module_id: op.revision.continuity_repair
    weight: 1.0
  - module_id: op.revision.revision_note_quality
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: holistic
  title: Holistic integrity
  points: 8.0
  components:
  - module_id: core.holistic_artistic_success
    weight: 1.0
  score_mode: weighted_binary_mean
penalty_modules: []
hard_gate_policy:
  no_is_invalid: true
  cannot_assess_is_unresolved: true
  not_applicable_requires_condition_or_reason: true
  hard_gates_are_reported_separately: true
coverage_policy:
  minimum_weighted_coverage: 0.92
  below_threshold_status: PROVISIONAL
  score_interval_required_when_unassessed: true
  whole_work_claims_require_whole_work_evidence: true
excerpt_and_incomplete_policy:
  flagged_excerpt: Do not penalize absent whole-work completion. Mark unavailable whole-work criteria CANNOT_ASSESS
    or NOT_APPLICABLE as appropriate.
  unflagged_incomplete: Apply the bounded unflagged-incomplete penalty when the artifact is presented as complete
    or partial status is omitted.
  visible_local_defects: Score defects visible in the supplied extract normally.
judge_policy:
  artifact_assumed_ai_generated: true
  strict_but_fair: true
  no_glazing: true
  judge_execution_not_intent: true
  do_not_invent_defects: true
  avoid_length_and_ornament_bias: true
  brief_evidence_required: true
  private_chain_of_thought_not_requested: true
  verdict_states:
  - 'YES'
  - 'NO'
  - NOT_APPLICABLE
  - CANNOT_ASSESS
  pairwise_finalists: false
notes: []
