$schema: ../schema/hbq_bundle.schema.json
standard:
  id: HBQ-RS
  version: 1.2.1
bundle_id: default.restrained_final_pass
version: 1
title: Restrained final pass
description: Corrects remaining defects without homogenizing voice, over-beautifying, or making unauthorized structural
  changes.
artifact_types:
- final_text
valid_scopes:
- passage
- scene
- chapter
- manuscript
profile: {}
module_ids:
- core.task_and_brief_fidelity
- op.revision.restrained_final_pass
- core.change_authorization
- core.voice_and_stylistic_identity
- op.revision.line_edit
- core.language_craft
- core.coherence_and_comprehensibility
- craft.narrative.continuity_and_canon_integrity
- core.economy_and_relevance
- core.freshness_and_non_genericness
- core.mechanics_and_presentation
- op.revision.copy_edit
- op.revision.revision_verification
- core.holistic_artistic_success
- penalty.purple_prose
- penalty.repetition
- penalty.unflagged_incomplete
domains:
- domain_id: task
  title: Final-pass brief
  points: 10.0
  components:
  - module_id: core.task_and_brief_fidelity
    weight: 1.0
  - module_id: op.revision.restrained_final_pass
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: authorization
  title: Authorization and preservation
  points: 18.0
  components:
  - module_id: core.change_authorization
    weight: 1.0
  - module_id: core.voice_and_stylistic_identity
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: line
  title: Line craft
  points: 18.0
  components:
  - module_id: op.revision.line_edit
    weight: 1.0
  - module_id: core.language_craft
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: clarity
  title: Clarity and continuity
  points: 14.0
  components:
  - module_id: core.coherence_and_comprehensibility
    weight: 1.0
  - module_id: craft.narrative.continuity_and_canon_integrity
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: economy
  title: Economy and repetition
  points: 12.0
  components:
  - module_id: core.economy_and_relevance
    weight: 1.0
  - module_id: core.freshness_and_non_genericness
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: mechanics
  title: Mechanics
  points: 10.0
  components:
  - module_id: core.mechanics_and_presentation
    weight: 1.0
  - module_id: op.revision.copy_edit
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: verify
  title: Before/after verification
  points: 10.0
  components:
  - module_id: op.revision.revision_verification
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: holistic
  title: Holistic preservation and finish
  points: 8.0
  components:
  - module_id: core.holistic_artistic_success
    weight: 1.0
  score_mode: weighted_binary_mean
penalty_modules:
- module_id: penalty.purple_prose
  cap_points: 5.0
- module_id: penalty.repetition
  cap_points: 8.0
- module_id: penalty.unflagged_incomplete
  cap_points: 8.0
hard_gate_policy:
  no_is_invalid: true
  cannot_assess_is_unresolved: true
  not_applicable_requires_condition_or_reason: true
  hard_gates_are_reported_separately: true
coverage_policy:
  minimum_weighted_coverage: 0.92
  below_threshold_status: PROVISIONAL
  score_interval_required_when_unassessed: true
  whole_work_claims_require_whole_work_evidence: true
excerpt_and_incomplete_policy:
  flagged_excerpt: Do not penalize absent whole-work completion. Mark unavailable whole-work criteria CANNOT_ASSESS
    or NOT_APPLICABLE as appropriate.
  unflagged_incomplete: Apply the bounded unflagged-incomplete penalty when the artifact is presented as complete
    or partial status is omitted.
  visible_local_defects: Score defects visible in the supplied extract normally.
judge_policy:
  artifact_assumed_ai_generated: true
  strict_but_fair: true
  no_glazing: true
  judge_execution_not_intent: true
  do_not_invent_defects: true
  avoid_length_and_ornament_bias: true
  brief_evidence_required: true
  private_chain_of_thought_not_requested: true
  verdict_states:
  - 'YES'
  - 'NO'
  - NOT_APPLICABLE
  - CANNOT_ASSESS
  pairwise_finalists: false
notes: []
