$schema: ../schema/hbq_bundle.schema.json
standard:
  id: HBQ-RS
  version: 1.2.1
bundle_id: default.fine_scene_outline
version: 1
title: Fine scene outline
description: Evaluates scene-level objectives, pressure, beats, turn, resulting state, continuity, and drafting
  usefulness.
artifact_types:
- outline
- scene_plan
valid_scopes:
- scene
profile: {}
module_ids:
- core.task_and_brief_fidelity
- core.length_and_scope_fit
- op.outline.fine_detail_beat_outline
- craft.narrative.scene_construction
- craft.narrative.characterization
- craft.narrative.point_of_view_and_focalization
- craft.narrative.continuity_and_canon_integrity
- craft.narrative.temporal_and_spatial_continuity
- op.outline.scene_or_chapter_planning
- op.outline.outline_consistency
- op.ingest.context_pack_construction
- core.holistic_artistic_success
domains:
- domain_id: task
  title: Task and scope
  points: 8.0
  components:
  - module_id: core.task_and_brief_fidelity
    weight: 1.0
  - module_id: core.length_and_scope_fit
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: detail
  title: Beat-outline completeness
  points: 24.0
  components:
  - module_id: op.outline.fine_detail_beat_outline
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: scene
  title: Scene construction
  points: 18.0
  components:
  - module_id: craft.narrative.scene_construction
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: character
  title: Character and knowledge state
  points: 14.0
  components:
  - module_id: craft.narrative.characterization
    weight: 1.0
  - module_id: craft.narrative.point_of_view_and_focalization
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: continuity
  title: Continuity and canon
  points: 14.0
  components:
  - module_id: craft.narrative.continuity_and_canon_integrity
    weight: 1.0
  - module_id: craft.narrative.temporal_and_spatial_continuity
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: fit
  title: Neighbor and outline fit
  points: 8.0
  components:
  - module_id: op.outline.scene_or_chapter_planning
    weight: 1.0
  - module_id: op.outline.outline_consistency
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: utility
  title: Drafting usefulness
  points: 6.0
  components:
  - module_id: op.ingest.context_pack_construction
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: holistic
  title: Holistic planning usefulness
  points: 8.0
  components:
  - module_id: core.holistic_artistic_success
    weight: 1.0
  score_mode: weighted_binary_mean
penalty_modules: []
hard_gate_policy:
  no_is_invalid: true
  cannot_assess_is_unresolved: true
  not_applicable_requires_condition_or_reason: true
  hard_gates_are_reported_separately: true
coverage_policy:
  minimum_weighted_coverage: 0.9
  below_threshold_status: PROVISIONAL
  score_interval_required_when_unassessed: true
  whole_work_claims_require_whole_work_evidence: true
excerpt_and_incomplete_policy:
  flagged_excerpt: Do not penalize absent whole-work completion. Mark unavailable whole-work criteria CANNOT_ASSESS
    or NOT_APPLICABLE as appropriate.
  unflagged_incomplete: Apply the bounded unflagged-incomplete penalty when the artifact is presented as complete
    or partial status is omitted.
  visible_local_defects: Score defects visible in the supplied extract normally.
judge_policy:
  artifact_assumed_ai_generated: true
  strict_but_fair: true
  no_glazing: true
  judge_execution_not_intent: true
  do_not_invent_defects: true
  avoid_length_and_ornament_bias: true
  brief_evidence_required: true
  private_chain_of_thought_not_requested: true
  verdict_states:
  - 'YES'
  - 'NO'
  - NOT_APPLICABLE
  - CANNOT_ASSESS
  pairwise_finalists: false
notes: []
