$schema: ../schema/hbq_bundle.schema.json
standard:
  id: HBQ-RS
  version: 1.2.1
bundle_id: default.haiku
version: 1
title: Default English haiku — contemporary
description: 'Contemporary English-haiku profile: three-line breath-length compression rather than mandatory seventeen
  syllables, while retaining seasonal field and cut/juxtaposition.'
artifact_types:
- poetry
valid_scopes:
- poem
- stanza
- sequence
profile:
  module: form.poetry.haiku_in_english
  profile: contemporary_english_haiku
  seasonal_reference_scope: whole_poem
  multi_stanza: each stanza 5-7-5; shared kigo only when explicitly enabled
module_ids:
- core.task_and_brief_fidelity
- core.length_and_scope_fit
- form.poetry.haiku_in_english
- core.freshness_and_non_genericness
- core.mechanics_and_presentation
- core.holistic_artistic_success
- penalty.purple_prose
- penalty.repetition
- penalty.unflagged_incomplete
domains:
- domain_id: task
  title: Task and declared profile
  points: 8.0
  components:
  - module_id: core.task_and_brief_fidelity
    weight: 1.0
  - module_id: core.length_and_scope_fit
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: form
  title: Syllables and stanza form
  points: 22.0
  components:
  - module_id: form.poetry.haiku_in_english
    weight: 1.0
    include_group_ids:
    - form.poetry.haiku_in_english.form
  score_mode: weighted_binary_mean
- domain_id: season
  title: Seasonal field and immediacy
  points: 18.0
  components:
  - module_id: form.poetry.haiku_in_english
    weight: 1.0
    include_group_ids:
    - form.poetry.haiku_in_english.season
  score_mode: weighted_binary_mean
- domain_id: cut
  title: Cut and juxtaposition
  points: 18.0
  components:
  - module_id: form.poetry.haiku_in_english
    weight: 1.0
    include_group_ids:
    - form.poetry.haiku_in_english.cut_juxtaposition
  score_mode: weighted_binary_mean
- domain_id: language
  title: Compression and language
  points: 16.0
  components:
  - module_id: form.poetry.haiku_in_english
    weight: 1.0
    include_group_ids:
    - form.poetry.haiku_in_english.haiku_quality
  - module_id: core.freshness_and_non_genericness
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: sequence
  title: Sequence integrity
  points: 6.0
  components:
  - module_id: form.poetry.haiku_in_english
    weight: 1.0
    include_group_ids:
    - form.poetry.haiku_in_english.sequence
  score_mode: weighted_binary_mean
- domain_id: mechanics
  title: Presentation
  points: 4.0
  components:
  - module_id: core.mechanics_and_presentation
    weight: 1.0
  score_mode: weighted_binary_mean
- domain_id: holistic
  title: Holistic artistic success
  points: 8.0
  components:
  - module_id: core.holistic_artistic_success
    weight: 1.0
  score_mode: weighted_binary_mean
penalty_modules:
- module_id: penalty.purple_prose
  cap_points: 4.0
- module_id: penalty.repetition
  cap_points: 6.0
- module_id: penalty.unflagged_incomplete
  cap_points: 8.0
hard_gate_policy:
  no_is_invalid: true
  cannot_assess_is_unresolved: true
  not_applicable_requires_condition_or_reason: true
  hard_gates_are_reported_separately: true
coverage_policy:
  minimum_weighted_coverage: 0.92
  below_threshold_status: PROVISIONAL
  score_interval_required_when_unassessed: true
  whole_work_claims_require_whole_work_evidence: true
excerpt_and_incomplete_policy:
  flagged_excerpt: Do not penalize absent whole-work completion. Mark unavailable whole-work criteria CANNOT_ASSESS
    or NOT_APPLICABLE as appropriate.
  unflagged_incomplete: Apply the bounded unflagged-incomplete penalty when the artifact is presented as complete
    or partial status is omitted.
  visible_local_defects: Score defects visible in the supplied extract normally.
judge_policy:
  artifact_assumed_ai_generated: true
  strict_but_fair: true
  no_glazing: true
  judge_execution_not_intent: true
  do_not_invent_defects: true
  avoid_length_and_ornament_bias: true
  brief_evidence_required: true
  private_chain_of_thought_not_requested: true
  verdict_states:
  - 'YES'
  - 'NO'
  - NOT_APPLICABLE
  - CANNOT_ASSESS
  pairwise_finalists: false
notes:
- The scorer de-duplicates repeated module leaves; production compilers should select the matching internal groups
  for each category.
- Alias of poetry.haiku.contemporary for the source-recommended default bundle name.
