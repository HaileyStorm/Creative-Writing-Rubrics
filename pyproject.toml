[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "creative-writing-rubrics"
version = "1.2.3"
description = "HBQ-RS creative-writing rubrics: compile bundles, score binary verdicts, and render judge prompts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Mixed: Apache-2.0 and LicenseRef-CWR-Community-1.0; see LICENSE" }
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]
authors = [{ name = "Hailey Collet" }]
keywords = [
  "creative-writing",
  "rubrics",
  "llm-eval",
  "benchmarking",
  "hbq-rs",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing",
]
dependencies = ["pyyaml>=6.0", "jsonschema>=4.0"]

[project.optional-dependencies]
# Compatibility alias for existing `.[schema]` installs; validation is now available in the base package.
schema = ["jsonschema>=4.0"]
dev = ["hatchling>=1.27"]
hanna-dev = ["dspy==3.3.1", "optuna==4.9.0"]

[project.scripts]
cwr = "hbqrs.cli:main"
hbq = "hbqrs.cli:main"

[project.urls]
Homepage = "https://github.com/HaileyStorm/Creative-Writing-Rubrics"
Repository = "https://github.com/HaileyStorm/Creative-Writing-Rubrics"
Documentation = "https://github.com/HaileyStorm/Creative-Writing-Rubrics#readme"

[tool.hatch.build]
# Local research state and ownership records never belong in release archives.
exclude = ["/docs/CWR_CURRENT_WORKLOG.md", ".working", ".working.*"]
skip-excluded-dirs = true

[tool.hatch.build.targets.sdist]
include = [
  "src/hbqrs",
  "registry",
  "bundles",
  "schema",
  "prompts",
  "examples",
  "evaluation-results",
  "docs",
  "sources",
  "LICENSE",
  "licenses",
  "NOTICE",
  "README.md",
  "CITATION.cff",
  "manifest.json",
]

[tool.hatch.build.targets.wheel]
only-include = [
  "src/hbqrs", "registry", "bundles", "schema", "prompts", "examples",
  "docs", "sources", "licenses",
]

# Normal selection applies VCS ignores and the exclusions above to every tree.
[tool.hatch.build.targets.wheel.sources]
"src" = ""
"registry" = "hbqrs/book/registry"
"bundles" = "hbqrs/book/bundles"
"schema" = "hbqrs/book/schema"
"prompts" = "hbqrs/book/prompts"
"examples" = "hbqrs/book/examples"
"docs" = "hbqrs/book/docs"
"sources" = "hbqrs/book/sources"

# Both component licenses and their scope travel with packaged CWR content.
"licenses" = "hbqrs/book/licenses"

# Individual-file destinations require exact force mappings; no trees bypass filters.
[tool.hatch.build.targets.wheel.force-include]
"manifest.json" = "hbqrs/book/manifest.json"
"LICENSE" = "hbqrs/book/LICENSE"
"NOTICE" = "hbqrs/book/NOTICE"

[tool.pytest.ini_options]
# No routine unit/integration discovery. Retained studies are historical sources,
# reproduced explicitly at their recorded revision when the evidence requires it.
testpaths = ["tests"]
python_files = []
addopts = "-q"
